# Case 18 with gpucfd: the shock tube, next to OpenFOAM. Written BEFORE the runs, 2026-11-15 10:25.
# (Before this plan gpucfd's new compressible solver had run only its rungs 1 and 2: kernels against NumPy and
# smooth flows. No shock tube had been run.)
# Why: the one-page progress report of case 18 has no gpucfd column, and the ladder to the detonation engine
# needs a second solver on the same grids (the case's own limit: "a second one on the same grids would tell").

what_is_compared: >
  The same problem (cases/shock_tube_sod/problem.yaml), the same uniform grids (100 to 12800 cells), the same
  outputs read by the same rules (cases/shock_tube_sod/measure.py with the extraction settings of the case's
  numerics.yaml), against the exact solution averaged over each cell. The exact solution is gpucfd's own
  (gpucfd/exact_riemann.py), not the case's; the script first checks that it gives OpenFOAM's stored profiles
  the errors OpenFOAM's report recorded.
grids: [100, 200, 400, 800, 1600, 3200, 6400, 12800]
set_up: >
  Closed ends as frictionless walls, the two states left and right of the middle face, to t_end in a fixed number
  of equal steps (ten equal chunks, a snapshot after each, as the case took). Precision: mixed (state stored in
  double, fluxes computed in single), the solver's default after rung 2; one grid is repeated in double and in
  single.
what_each_side_is_given:
  openfoam: >
    rhoCentralFoam as the solver agent of case 18 set it up: Kurganov flux, van Leer limiter, the explicit Euler
    step (its only one), 1.8 steps per cell (Courant number 0.19 with the fastest signal, chosen by that agent
    from four time steps on 400 cells because larger steps ring). One CPU core. Its numbers are read from
    results/shock_tube_sod/ and are not rerun.
  gpucfd: >
    Three-stage time scheme. Reconstruction, flux formula and Courant number chosen by the tuning budget below.
    RTX 4070.
tuning_budget: >
  On 400 cells only: reconstruction (van Leer, MC, WENO5) x flux formula (HLL, HLLC) x Courant number (0.4, 0.8),
  twelve runs. Chosen: the lowest sum of the three errors (density, velocity, pressure) among the runs that keep
  case 18's two limits, ripple between fan and shock at most 1 % and extra up-and-down (total variation above
  the exact one) at most 5 %. That one setting is used on all grids. Nothing else is tried. A second family,
  "like for like", is run without tuning: van Leer and HLL (the closest to OpenFOAM's limiter and flux) at the
  same Courant number as the chosen setting, so that the effect of the reconstruction can be told from the
  effect of the time scheme.
stop: each run ends at t_end = 0.5 ms; before that no wave has reached an end (checked - the two end cells unchanged).
judged_by: >
  The acceptance rules of the case's numerics.yaml that do not depend on OpenFOAM (conservation of mass, energy
  and momentum; ends undisturbed; error on the finest grid against the 100-cell error with the order floors;
  states, positions and speeds on the finest grid; ripple, wiggle and shock width as warnings). Conservation
  limits are those of the precision used: 1e-11 in double, 1e-9 in mixed.
timing: >
  Wall time per grid from creating the solver to the final field on the CPU, without the per-step totals (a
  second run of each grid records the totals after every step for the conservation check). The one-off start
  of the GPU library is measured separately. OpenFOAM's times are its recorded one-core wall times.
  Marked busy if another solver is running on the CPU (the case 19 agent is, today).
prediction:                  # before the runs
  accuracy: >
    Errors below OpenFOAM's on every grid, by a factor of 1.5 to 3 with the tuned setting, and about equal with
    the like-for-like setting. The order with which the error falls stays near 0.8 for the density (the border
    between the two gases is smeared by any scheme of this kind) and near 1 for pressure and velocity. Shock 2
    cells wide or less. Ripple behind the shock below OpenFOAM's 0.6 % at four times its time step.
  speed: >
    About a quarter of OpenFOAM's steps. A step costs about 0.1 ms whatever the grid (three kernel launches), so
    12800 cells should take under 2 s against OpenFOAM's 84 s, and 100 cells about as long as OpenFOAM's 0.4 s
    or less. In one dimension the GPU is idle most of the time; this is no measure of its speed.
expected_cost: under one minute for everything.

# ---- added AFTER the first run, 2026-11-15 10:24 (everything above is unchanged) ----
after_first_run: >
  The first run of this plan chose WENO5 with HLLC at Courant number 0.4 and gave the accuracy and times that
  were expected, but missed three of the case's rules in mixed precision: momentum against the push of the two
  ends 8e-8 (limit 1e-9), energy 1.3e-9, and the end cells disturbed at 1e-7. Cause, in the solver and not in
  the settings: with fluxes in single precision the wall's pressure flux was not exactly the pressure (the
  HLLC formula divided and multiplied by the same wave speed), and each cell rounded its own flux difference
  in single precision. Both were fixed in gpucfd/src/gcfdc.cu (the wall flux is now exact, flux differences are
  formed in double). The plan was then run again as written, tuning included: same budget, same rule. The
  record holds the second run; the first run's log lines are quoted in gpucfd/COMPRESSIBLE.md.
  A third cause showed in that second run (mass 4e-10 and end cells disturbed, with WENO5 only): the two cells
  that share a face did not compute bit-identical fluxes, because the compiler fused multiply-adds differently
  in the copies of the reconstruction. The compressible library is now built without fused multiply-add
  (gpucfd/build.sh) and the plan was run a third time as written. What is left by design: with fluxes in single
  precision the pressure on the two end walls is accurate to single precision, so the momentum follows the
  exact push of the ends to 5e-8, not to the 1e-9 written above. That limit is reported as expected and found.
