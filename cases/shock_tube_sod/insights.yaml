- id: 14
  stage: tooling
  logged: '2026-11-15 09:12'
  status: resolved
  problem: In the theory cards' symbol tables a pressure of 10000 Pa and one of 30313 Pa were printed in computer
    e-notation (a 1, the letter e and +04), not as numbers.
  diagnosis: cfdlib.report.tex_num formats numbers between 0.001 and 100000 with Python's g format and 4
    significant digits. A five-digit number then comes out in e-notation, inside math, where the typesetting check
    does not look. The template applies this to every value of a card's symbol table.
  fix: The case passes these values as a float that prints a five-digit number in full (theory.py, class _Shown).
    A workaround in the case, because the shared tools are not mine to change.
  lesson: Any case with pressures in pascal meets this; the earlier cases had no values in that range.
  guideline: In cfdlib.report.tex_num, write numbers from 10000 to 100000 without e-notation whatever the number
    of significant digits (or switch to the power-of-ten form), and add a test with 10000 and 30313.
  resolved: '2026-11-15 09:14'
