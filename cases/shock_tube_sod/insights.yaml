- id: 11
  stage: performance
  logged: '2026-11-15 08:58'
  status: resolved
  problem: What the runs cost. The finest grid (12800 cells, 23040 steps) took 84 seconds on one core, and all 16
    runs together about two minutes of solver time.
  diagnosis: The solver is explicit, so a run costs cells times steps, about 0.3 microseconds per cell and step on
    the larger grids. Runs below 1000 cells are dominated by start-up (about half a second). The time step is set
    by the ripple of the Euler step, not by stability. At twice the step the run still holds together but ripples
    by 3 %.
  fix: Nothing to fix in one dimension. Recorded in the performance appendix.
  lesson: For this solver the lever on speed is the time scheme, not the work per step. With an error that falls
    like the cell size to the power 0.8, ten times less error needs about 17 times more cells.
  guideline: For the next steps of the ladder (two dimensions, chemistry), carry these two numbers into the
    cost estimate before choosing grids. A solver with a multi-stage time scheme would be the tool to compare
    against.
  resolved: '2026-11-15 09:05'
