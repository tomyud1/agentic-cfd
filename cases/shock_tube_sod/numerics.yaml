# Numerical choices (made by the agent, not given by the user).
solver: rhoCentralFoam        # OpenFOAM's density-based solver for flows with shocks (explicit, central fluxes)
side: 1.0                     # cross-section of the tube model: 1 m x 1 m, so volume integrals are per unit area
# The time step is the time of interest divided by a whole number of steps: steps = steps_per_cell x cells.
# With the fastest signal of the exact solution (u* + c*_R = 693 m/s) 1.8 steps per cell is a
# Courant number of 0.19: that signal crosses a fifth of a cell per step.
main: {flux: Kurganov, limiter: vanLeer, steps_per_cell: 1.8}
snapshots: 10                 # fields written at 10 equally spaced times up to t_end (wave speeds are fitted from them)
runs:
  family: [100, 200, 400, 800, 1600, 3200, 6400, 12800]   # cells along the tube, ratio 2; time step halved with the cell size
  timestep: {cells: 400, steps_per_cell: [0.9, 1.8, 3.6, 7.2]}   # same grid, time step halved three times
  schemes:                    # same grid and time step, other ways of building the face values
    cells: 400
    variants: [[Tadmor, vanLeer], [Kurganov, vanAlbada], [Kurganov, Minmod], [Kurganov, SuperBee], [Kurganov, upwind]]
preflight:
  fraction: 0.1               # short test: the first 10 % of the time of interest, coarsest and finest grid
# How outputs are read from a profile (the same rules are applied to the exact solution, to measure their bias)
extraction:
  plateau_middle: 0.5         # a uniform state is the mean over the middle half of the stretch between two waves
  jump_levels: [0.1, 0.9]     # a jump's width is the distance between 10 % and 90 % of its height, in cells
  fan_fit: [0.2, 0.8]         # the fan's ends: straight-line fit of u between 20 % and 80 % of u*, extended to u = 0 and u = u*
  speed_from: 0.5             # wave speeds: straight-line fit of position against time over the snapshots from t_end/2 on
# Acceptance rules for the verdict. Written after the pre-flight (100 cells in full, the time-step
# study on 400 cells, short tests on 100 and 12800 cells) and BEFORE any finer production run.
# "finest" is the 12800-cell run of the grid family. A broken fail_ rule gives FAIL, a broken warn_ rule WARN.
acceptance:
  # Conservation, every step of every run (relative). Pre-flight: changes of 1e-15 to 1e-14, pure round-off.
  # A leak through an end or a non-conservative update would show at the size of the scheme's own error, 1e-6 or more.
  fail_mass_drift: 1.0e-11        # largest change of the total mass during a run / the mass
  fail_energy_drift: 1.0e-11      # the same for the total energy
  fail_momentum: 1.0e-11          # largest |total momentum - (p_L - p_R) t| / ((p_L - p_R) t_end)
  fail_ends: 1.0e-10              # at t_end: relative pressure change and |u|/u* in the two end cells (pre-flight: 7e-16)
  # Profiles on the finest grid: L1 error <= (error on 100 cells) x (cell-size ratio)^floor. The floor is the lowest
  # order that theory allows: a jump that the flow does not steepen (the border of the two gases, in the density)
  # is smeared like h^(2/3) by a second-order method, a shock like h. Pre-flight, 100 -> 400 cells: order 0.91 to 0.94.
  fail_l1_order_floor: {rho: 0.7, u: 0.85, p: 0.85}
  # Uniform states on the finest grid, relative error. Pre-flight: at most 8e-3 on 100 cells and 3.6e-4 on 400 cells.
  fail_state: 1.0e-4
  # Wave positions on the finest grid, as a fraction of the tube length. Pre-flight on 400 cells: shock and border
  # 3e-4 (0.13 cells), fan ends 2.5e-3 (1 cell). First order would give 1e-5 and 8e-5 on 12800 cells.
  fail_position_jump: 1.0e-4      # shock, border between the two gases (1.3 cells of the finest grid)
  fail_position_fan: 3.0e-4       # front and back of the fan (read from a straight-line fit)
  # Wave speeds on the finest grid, error as a fraction of the shock speed. Pre-flight on 400 cells: up to 1.9e-3.
  fail_speed: 3.0e-4
  # Observed order of the L1 error at the last refinement (6400 -> 12800 cells).
  warn_order: {rho: [0.6, 1.1], u: [0.8, 1.2], p: [0.8, 1.2]}
  # Wiggles. The exact density and pressure only fall from left to right; extra up-and-down (total variation above
  # the exact one) was 1.6 to 2.8 % at the main time step in the pre-flight and 9 to 12 % at twice that step.
  warn_wiggle: 0.05               # every run of the grid family
  # Ripple of pressure and velocity on the uniform stretch between the fan and the shock (highest minus lowest
  # value over its middle half, relative): 0.6 % on 400 cells at the main time step, about 4 % at twice that step.
  warn_plateau_ripple: 0.01       # finest grid
  warn_shock_cells: 3.0           # 10-90 % width of the shock in cells, every grid (pre-flight: 2.2)
