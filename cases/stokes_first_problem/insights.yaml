- id: 2
  stage: setup
  logged: 2026-11-11 00:12
  status: resolved
  problem: 'The closest tutorial (pimpleFoam/laminar/planarPoiseuille: 1D, wall + symmetryPlane, cyclic x, backward)
    uses momentumPredictor off with 15 outer correctors. For a linear diffusion problem that is a slow Jacobi-like
    iteration; unclear from the primer whether to keep it.'
  diagnosis: The tutorial is built for viscoelastic (Maxwell) cases where the stress equation is coupled; for a
    linear Newtonian diffusion problem one implicit momentum solve per step is the exact discrete answer.
  fix: Momentum predictor on, 1 outer corrector, velocity solved to \(10^{-12}\). Confirmed afterwards by the per-step
    momentum balance (round-off level on every run) rather than by assumption.
  lesson: Start from the closest tutorial for structure (patches, 1D layout, schemes), but re-derive the algorithm
    settings from the physics, as SKILL.md says (copy structure, not numerics).
  guideline: 'openfoam-primer.md: add planarPoiseuille as the template for 1D transient wall-bounded flows and a
    note that linear problems need only momentumPredictor yes + nOuterCorrectors 1.'
  resolved: 2026-11-11 00:23
