    instead of reading the id that log() returned.'
  diagnosis: log() returns the id but the CLI/Python call I used did not show it clearly (it printed a bare number
    among other output), and resolve() silently overwrites fields of an already-resolved entry.
  fix: Restored entry 3 from my transcript and moved the text to entry 4 (scratch/fix_insights.py). Caught only
