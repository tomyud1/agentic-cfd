- id: 4
  stage: preflight
  logged: 2026-11-11 00:16
  status: resolved
  problem: 'Pre-flight FAILED on the coarse level: "Continuity-error trend \(\times 1.9\times10^{8}\)", and warned
    on the fine level: "Residual trend Uy \(\times 16.6\)". The physics looked right (wall stress and momentum at
    1 s within 1 % of exact).'
  diagnosis: 'False alarms. The continuity error (sum local) went from \(10^{-28}\) to \(7\times10^{-19}\) and \(|v|/U\)
    is \(10^{-17}\): both are round-off, because this flow has \(v = 0\) and \(\nabla\cdot\mathbf{u} = 0\) exactly.
    <code>monitor.assess</code> judges continuity and residuals only by their late/early RATIO, and a ratio of round-off
    noise can be anything (\(1.9\times10^{8}\) here). This is pitfall 3 of the primer (residuals of ~zero fields),
    but for the continuity check, which <code>assess()</code> treats as FAIL (ratio above 100), not just warn.'
  fix: 'Case-local <code>health()</code> wrapper in run.py: keeps the <code>assess()</code> output but downgrades
    the continuity-trend and Uy-trend checks to ok ONLY if the absolute level is round-off (sum local below \(10^{-12}\),
    \(\max|v|/U\) below \(10^{-10}\)), keeps the original verdict in the text, and adds an explicit absolute-level
    check. Cost about 10 minutes.'
  lesson: 'Trend checks need an absolute floor: a growing ratio of numbers at machine precision is not divergence.'
  guideline: '<code>cfdlib.monitor.assess</code>: skip (or mark ok) the continuity-error trend when its maximum
    is below an absolute floor (e.g. \(10^{-12}\)), and the residual trend of a field whose normalised residual
    is noise; report the absolute maximum next to the ratio. Primer pitfall 3: extend it to continuity errors.'
  resolved: 2026-11-11 00:17
- id: 5
  stage: analysis
  logged: 2026-11-11 00:19
  status: resolved
  problem: 'Surprise in the momentum-balance check: to close the discrete balance \(dP/dt = |\tau_w|\) at the first
    step, the Euler formula is needed, not BDF2 (with BDF2 there the balance error is of order 1). OpenFOAM backward
    uses Euler for the first step (no old-old field yet).'
  diagnosis: <code>backwardDdtScheme</code> falls back to Euler when only one old time level exists. With the matching
    formula per step (Euler at step 1, BDF2 after) the balance holds to \(10^{-8}\) of the final wall stress on
    every run (accumulated round-off over 8000 steps).
  fix: 'The check uses the scheme the solver actually applied: Euler for step 1, BDF2 coefficients (3/2, -2, 1/2)
    after.'
  lesson: A discrete conservation check must mirror the exact discrete operator, including start-up special cases;
    this check then verifies the solver to round-off and is far stronger than residuals.
  guideline: 'openfoam-primer.md: note that backward (BDF2) starts with one Euler step, and suggest the per-step
    integral balance (volFieldValue volIntegrate + wall flux) as the physical convergence check for transient runs.'
- id: 6
  stage: analysis
  logged: 2026-11-11 00:19
  status: resolved
  problem: The acceptance tolerances I fixed before seeing results (0.2 % for profile, wall stress and momentum;
    0.5 % for depth) turned out about 100 times looser than what the finest run achieved (profile \(2\times10^{-5}\,U\),
    wall stress \(2\times10^{-6}\)). The verdict is PASS, but the rule was not discriminating.
  diagnosis: SKILL.md asks to fix checks before results but gives no way to size a verification tolerance; I guessed
    from engineering habit. Here the coarsest run already met every tolerance, so the rules could not catch a moderately
    wrong finest run.
  fix: 'Kept the pre-set rules (no moving goalposts) and added the stronger, physics-based evidence alongside: observed
    order 2.00 on the combined family, a wall-stress error that follows the predicted \(h^2/(\nu t)\) law, and the
    momentum balance to \(10^{-8}\).'
  lesson: For verification, the strongest acceptance rule is the observed order plus agreement with a predicted
    error law; absolute tolerances should be sized from a pre-flight coarse-run error and the expected order.
  guideline: 'SKILL.md stage 2: for verification cases, size tolerances from the pre-flight (coarse) error divided
    by \(r^p\) per refinement, and make the observed order (within 0.3 of the design order) a pass rule, not only
    a warn rule.'
