- id: 9
  stage: report
  logged: 2026-11-11 00:26
  status: resolved
  problem: 'Visual review of the first passing report found 5 things the contract did not: (1) a definition card
    whose formula is too wide (horizontal scrollbar inside the card; the table-wrap overflow check does not cover
    definition cards); (2) table numbers with stripped trailing zeros (tex_num uses g-format: 0.10074 next to 0.100743),
    so columns look ragged; (3) plain-text math in theory notes (sqrt, tau_w, Unicode) that the lint does not catch;
    (4) a comparison finding of mine that attributed the wall-stress error to the two-point wall gradient, while
    the data show the opposite SIGN and 3x the size; (5) a hand-typed claim in the reproducibility notes ("under
    a minute").'
  diagnosis: 'The contract checks structure and typesetting patterns, not meaning or appearance: it cannot see a
    scrollbar inside a definition card, ragged digits, Unicode math, a physically wrong attribution, or a typed
    claim in free text. Item 4 was the important one: I wrote the explanation from the theory before comparing the
    SIGN of the measured error with the prediction.'
  fix: Split the definition; a fixed-significant-digit formatter for tables; LaTeX in all theory notes; the wall-stress
    finding is now conditional on the measured sign and says the error follows the \(h^2/(\nu t)\) law but is dominated
    by the near-wall cell values; the run-time note is computed. About 15 minutes.
  lesson: Compare a predicted error term with the data in sign as well as size before writing "where the error comes
    from".
  guideline: 'cfdlib.report: offer a fixed-digit number formatter for tables; contract.lint: flag Unicode math (√,
    τ, ∂, η) outside math delimiters; report template: wrap definition formulas or let the overflow check cover
    .def cards; SKILL.md stage 6: an explanatory finding must be checked against the data (sign, magnitude) in code.'
  resolved: 2026-11-11 00:28
- id: 10
  stage: report
  logged: 2026-11-11 00:28
  status: resolved
  problem: 'A Python patch script fed through a bash heredoc corrupted LaTeX in analytical.py: backslash sequences
    such as <code>\nu</code> and <code>\rho</code> became a newline and a control character inside raw strings,
    breaking two theory notes. Found only by re-reading the file.'
  diagnosis: Two layers of escaping (heredoc + Python string literal) for LaTeX-heavy replacement text; the assert
    on the OLD text passed, so nothing flagged the broken NEW text.
  fix: Repaired the three lines with the Edit tool and checked the file parses; used the Edit tool for all further
    changes.
  lesson: For LaTeX-heavy source edits use the editor tool, never generated patch scripts.
  guideline: 'SKILL.md / environment.md: one line - edit LaTeX-containing Python with the Edit tool; if a script
    must do it, read the replacement from a file, not a string literal.'
