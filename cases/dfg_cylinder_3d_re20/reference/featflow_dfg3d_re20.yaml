source: 'E. Bayraktar, O. Mierka and S. Turek, ''Benchmark computations of 3D laminar flow around a cylinder with
  CFX, OpenFOAM and FeatFlow'', International Journal of Computational Science and Engineering 7(3), 253-266, 2012.
  Results page of the FeatFlow group (TU Dortmund): http://wwwold.mathematik.tu-dortmund.de/~featflow/en/benchmarks/cfdbenchmarking/flow/dfg_flow3d/dfg_flow3d_results.html,
  retrieved 2026-11-11.'
benchmark: Steady test case 3D-1Z (Re = 20) of Schaefer and Turek, 'Benchmark computations of laminar flow around
  a cylinder', Notes on Numerical Fluid Mechanics 52, 547-566, Vieweg 1996.
reference_values:
  cd: 6.18533
  cl: 0.009401
  source: M. Braack and T. Richter, 'Solutions of 3D Navier-Stokes benchmark problems with adaptive finite elements',
    Computers and Fluids 35(4), 372-392, 2006 (quoted as reference [2] on the results page).
  note: The page gives the values without an uncertainty; the number of printed digits bounds it.
meshes: 'Hexahedral meshes: a 2D block mesh extruded in z with 4 cell layers and refined twice gives level 1 (6144
  cells); each further level halves the cell size in all three directions (8 times the cells).'
openfoam_settings_in_paper: OpenFOAM 1.6 with icoFoam (transient, PISO); the Re = 20 case was simulated towards
  the steady state. Gauss linear schemes, GAMG with Gauss-Seidel for p (tolerance 1e-7), PBiCG with DILU for U (tolerance
  1e-6), as listed on the software page.
