- id: 8
  stage: report
  logged: 2026-11-11 17:47
  status: resolved
  problem: 'The mid-plane picture needs the velocity on the plane z = H/2, which is a face plane of the mesh (even
    cell count in z). matplotlib''s Delaunay triangulation of the structured cell centres has degenerate triangles:
    plotting works, but LinearTriInterpolator raises ''Triangulation is invalid''. Matching the two cell layers
    next to the plane by sorted (x, y) also failed until the coordinates were rounded (round-off differences between
    layers reordered the sort).'
  diagnosis: Collinear points of a structured grid; floating-point ties in a lexicographic sort.
  fix: Average the two layers with linear weights after sorting rounded coordinates; interpolate along lines with
    scipy's LinearNDInterpolator.
  lesson: Structured-grid data and Delaunay-based tools do not mix well; prefer scipy (Qhull) or sampling in OpenFOAM.
  guideline: A helper in cfdlib to extract a plane of a structured mesh (or an OpenFOAM 'surfaces' sampling recipe
    in the primer) would save every 3D case this detour.
- id: 9
  stage: analysis
  logged: 2026-11-11 17:52
  status: resolved
  problem: 'The lift fails the rule fixed beforehand: on L4 it is 1.66 % above the reference, 2.5 times the band
    (GCI of L4 plus reference uncertainty). Its observed order on L2-L4 is 2.73 (L1-L3: 2.31), so the GCI band is
    narrow, and the Richardson value is still 1.16 % high. Drag passes (L4 -0.077 %, extrapolated +0.017 %).'
  diagnosis: 'Robustness runs (one change each): convection scheme on L3 moves the lift by 0.8 %; the O-grid radial
    cell distribution moves it from -3.0 % (ratio 2) through +4.4 % (ratio 4, production) to +9.8 % (ratio 8) of
    the reference on L3, with the drag almost unchanged. On L4, ratio 2 gives -0.27 % against +1.66 % for ratio
    4: the two mesh families approach the reference from opposite sides. The lift, a small difference of large pressure
    and friction forces, depends on how the gap flow between cylinder and walls is resolved; the GCI of one family
    (narrow because its observed order is high) does not see that.'
  fix: Kept the FAIL verdict of the rule fixed beforehand; reported the sensitivity runs and the spread between
    the two families as the honest lift uncertainty.
  lesson: For a small force component, one mesh family's GCI can be far too optimistic; a second family (different
    grading, same cell count) is a cheap and strong test.
  guideline: 'SKILL.md stage 5: for small or sensitive outputs (lift of a nearly symmetric body), run a second mesh
    family on at least two levels before trusting the GCI; budget for it in the plan.'
  resolved: 2026-11-11 18:10
