- id: 11
  stage: performance
  logged: 2026-11-11 17:58
  status: resolved
  problem: 'OpenFOAM''s per-iteration ClockTime in the log, which run.py and case 4 (_loop_us) use for time per
    iteration, is printed in whole seconds: on a 0.05 s iteration it is useless, on a 0.6 s one it carries a 5-10
    % error over 20 iterations. The timeInfo function object''s clockTime column has the same 1 s resolution.'
  diagnosis: 'Time::elapsedClockTime returns whole seconds. ExecutionTime (CPU time of rank 0, 0.01 s resolution)
    looked like wall time on the first checks, but on the 90 thousand cell mesh with 16 ranks it was half the wall
    time (0.020 against 0.039 s per iteration): with 16 ranks on 16 hardware threads, MPI yields the core instead
    of busy-waiting. That made 16 ranks look fastest on the small meshes. Profiling''s totals (time.run()) are high-resolution
    wall times.'
  fix: Time per iteration = profiled wall time of the iteration loop divided by the iteration count, on both sides
    (includes the first iteration's one-off costs, the same for every run of a mesh up to the GPU's CUDA start-up).
  lesson: Check the resolution AND the meaning (CPU or wall) of a clock before timing with it, on the smallest case
    too.
  guideline: 'cfdlib.perf: compute loop time from ExecutionTime differences (or profiling), never from ClockTime;
    say in SKILL.md that ClockTime has 1 s resolution.'
  resolved: 2026-11-11 18:39
- id: 12
  stage: gpu
  logged: 2026-11-11 18:06
  status: resolved
  problem: After the coarse-level fix (CG coarse solve, coarsest level at most 1000 rows) the GPU needed only 15
    CG iterations per pressure solve, but the multigrid set-up then cost about 0.9 s per solve on 1 million cells,
    several times the solve itself, so the GPU was still slower than GAMG.
  diagnosis: OGL rebuilds the multigrid hierarchy (PGM aggregation on the GPU) for every solve by default; a deeper
    hierarchy costs more to build.
  fix: 'Reuse the preconditioner for 20 solves (preconditioner { caching 20; }): the pressure matrix changes slowly
    between SIMPLE iterations, so the stale preconditioner costs about 1-4 extra CG iterations and saves the set-up.
    reuseHierarchy (recompute only the coarse matrices) helped less.'
  lesson: On the GPU, preconditioner set-up can dominate; amortise it over solves.
  guideline: 'environment.md OGL section: start GPU tuning from minCoarseRows ~1000, coarseSolver CG, maxIterSmoother
    2, caching 20, adaptMinIter off (the settings found here), not from the defaults.'
- id: 13
  stage: performance
  logged: 2026-11-11 18:39
  status: resolved
  problem: 'The CPU baseline is not ''GAMG on all cores'': on this steady 3D case GAMG with the DIC-Gauss-Seidel
    smoother needs 5 instead of 13 iterations per pressure solve and is about 6 % faster per iteration than with
    Gauss-Seidel, and 8 ranks beat 16 on every mesh from 0.3 to 4.75 million cells (L4: 1.72 s per iteration on
    8 ranks, 1.90 on 16). Case 4 (2D, transient) had found 16 ranks fastest.'
  diagnosis: A steady 3D SIMPLE iteration is memory-bandwidth bound; hyper-threads add MPI traffic and halo work
    without adding bandwidth. DIC smoothing does more per sweep but converges GAMG in fewer cycles.
  fix: The study's CPU baseline is the fastest of GAMG GS / GAMG DIC-GS on 8 or 16 ranks per mesh (4-16 on L4).
  lesson: '''Best CPU setup'' must be measured for each case; smoother and rank count both matter by 5-15 %.'
  guideline: 'primer, parallel section: add this case''s numbers (8 ranks best for steady 3D, DIC-GS smoother) next
    to case 4''s.'
- id: 14
  stage: gpu
  logged: 2026-11-11 19:15
  status: resolved
  problem: Even fully tuned, the GPU only breaks even at about 2 million cells and saves about 11 % of the time
    per SIMPLE iteration at 4.75 million cells (a factor 1.13), although its pressure solve there is 1.65 times
    faster than the best GAMG; on a converged L4 run both took about 11.5 minutes.
  diagnosis: 'Three limits stack up. (1) Amdahl: the pressure solve is only about a third of a steady SIMPLE iteration
    (momentum, assembly and the force output stay on the CPU), so even an infinitely fast solver gives at most about
    1.5 times. (2) Each solve pays a fixed host path: the ranks'' matrices are gathered and copied through host
    memory (no CUDA-aware MPI), tens of milliseconds outside OGL''s own timers. (3) The consumer GPU''s double precision
    is slow, so CG with multigrid needs 3 times the iterations of GAMG with DIC smoothing and gains only from memory
    bandwidth.'
  fix: 'Reported as the answer: break-even and gains measured, with the same converged forces on both sides.'
  lesson: For steady incompressible OpenFOAM runs, offloading only the pressure solve cannot give more than the
    pressure share allows; measure that share first (profiling) before investing in GPU tuning.
  guideline: 'SKILL.md performance study: start by measuring the pressure share with profiling and state the Amdahl
    bound; it sets expectations before any GPU run.'
  resolved: 2026-11-11 19:18
