- id: 3
  stage: performance
  logged: 2026-11-11 17:33
  status: resolved
  problem: 'The study needs the pressure-solve time of CPU runs, but GAMG prints no timings and cfdlib.perf only
    counts iterations. OpenFOAM''s built-in profiling (controlDict: profiling { active true; }) writes <time>/uniform/profiling
    with the wall time and call count of every section: fvMatrix::solve.p, fvMatrix::solve.U, each function object,
    for CPU and GPU runs alike (processor0/... in parallel runs).'
  diagnosis: 'Profiling is off by default and not mentioned in the guidelines. One quirk: its GAMG entry ''lduMatrix::solver.coarsestLevelCorr''
    reports almost the whole pressure solve (a nesting artefact), so only fvMatrix::solve.p is used.'
  fix: Profiling on in every run of this case (an output decision); run.py reads the totals per section from processor0.
  lesson: Before writing log parsers for timings, check what the solver can already measure about itself.
  guideline: 'SKILL.md performance section: switch on controlDict profiling for any performance study and read fvMatrix::solve.<field>;
    cfdlib.perf.summarize could parse uniform/profiling itself.'
  resolved: 2026-11-11 17:33
- id: 4
  stage: gpu
  logged: 2026-11-11 17:33
  status: resolved
  problem: 'OGL''s stopping criterion has adaptMinIter (default true): every pressure solve must do at least 0.6
    times the iterations of the previous one (log: ''Creating stopping criterion with minIter 421 frequency 6''),
    and the residual is checked only every few iterations. In a steady SIMPLE run with partial solves (relTol 0.05)
    this can force far more iterations than the tolerance needs.'
  diagnosis: 'Measured on the 1-million-cell mesh (4 ranks): with OGL''s default multigrid, switching adaptMinIter
    off cut the CG iterations per pressure solve from 132 to 97. With the tuned preconditioner the effect is small
    (16 with it, 15 without), because the iteration count no longer varies much between solves.'
  fix: adaptMinIter false in every tuned GPU configuration (run.py _gpu_mg).
  lesson: Library defaults tuned for transient runs with full solves can waste work in steady runs with partial
    solves.
  guideline: 'environment.md OGL section: mention adaptMinIter (default on) and set it off for partial (relTol)
    solves.'
  resolved: 2026-11-11 18:06
- id: 5
  stage: performance
  logged: 2026-11-11 17:33
  status: resolved
  problem: 'The forces function object costs about 6 % of each iteration on the 2.43 million cell mesh (two calls,
    cylinder and walls, 0.064 s each per iteration on 16 ranks; profiling): it evaluates the stress tensor on the
    whole mesh, not only on the patch.'
  diagnosis: forces builds devRhoReff (needs grad U everywhere) every call; at 2.4 million cells that is not free.
  fix: Kept every iteration (identical on CPU and GPU runs, so the comparison stays fair) and reported as part of
    the time outside the pressure solve.
  lesson: Every-iteration function objects are a measurable cost on large meshes and dilute any linear-solver speed-up.
  guideline: For long steady runs, evaluate forces every few iterations (executeInterval) once the stopping rule
    allows it.
  resolved: 2026-11-11 17:33
- id: 6
  stage: production
  logged: 2026-11-11 17:33
  status: resolved
  problem: 'The steady x-momentum balance of the channel closes only to 0.41, 0.28 and 0.23 % of the drag on L1,
    L2, L3: inside the 0.5 % rule set beforehand, but the imbalance shrinks slowly with refinement, not like a second-order
    error.'
  diagnosis: 'The balance neglects the viscous normal stress at inlet and outlet. In the continuous problem its
    integral over the inlet is zero (continuity: the integral of du/dx over a section with no-slip edges vanishes).
    The discrete one is not: the solver''s one-sided face gradient at an inlet whose profile is not the developed
    duct flow leaves a first-order remainder. Computed from the fields (run.py inletvisc), it is about three quarters
    of the imbalance on L1-L3; with it, the imbalance falls to about 0.1, 0.07 and 0.055 % of the drag.'
  fix: Kept the pass rule fixed beforehand (balance without the term, 0.5 %); report the inlet viscous term and
    the balance with it as a diagnostic.
  lesson: 'A conservation check is only as exact as its list of terms: a term that vanishes in the continuum may
    survive discretely at first order and look like a solver error.'
  guideline: 'primer: for a momentum balance through an inlet with a non-developed profile, include (or measure)
    the viscous flux through the inlet; it decays only like the first cell size.'
  resolved: 2026-11-11 17:44
