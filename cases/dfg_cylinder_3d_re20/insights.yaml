- id: 1
  stage: gpu
  logged: 2026-11-11 17:27
  status: resolved
  problem: environment.md lists the GPU multigrid options to explore as MaxLevels, MinCoarseRows and ZeroGuess.
    The OGL source (include/OGL/Preconditioner/Multigrid.hpp, CoarseSolver.cpp) reads them in lower camel case (maxLevels,
    minCoarseRows, smoother, maxIterSmoother, coarseSolver, maxIterCoarse, cycle, reuseHierarchy) and only from
    a preconditioner SUB-dictionary; there is no ZeroGuess option. Written as top-level keys they would be ignored
    silently.
  diagnosis: 'The option names in the guidance were guessed, not read from the plugin. OGL looks the preconditioner
    options up in the dictionary of the preconditioner entry (preconditioner { preconditioner Multigrid; minCoarseRows
    1000; ... }). Its defaults are weak for a large 3D problem: the coarsest level keeps 64000 rows and is ''solved''
    by ONE Jacobi sweep (coarseSolver Jacobi, maxIterCoarse 1), with one Jacobi smoothing sweep per level.'
  fix: Read the option names and defaults from ~/src/OGL before tuning; write them in a preconditioner sub-dictionary
    (run.py CONFIGS).
  lesson: Read the plugin's source for option names and defaults before tuning; a misspelt option in an OpenFOAM
    dictionary is ignored without a warning.
  guideline: 'environment.md, OGL section: replace ''MaxLevels, MinCoarseRows, ZeroGuess'' by the real names, show
    the sub-dictionary form and the defaults (minCoarseRows 64000, coarse solver = 1 Jacobi sweep).'
  resolved: 2026-11-11 17:27
