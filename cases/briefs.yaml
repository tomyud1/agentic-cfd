# The words of each case's one-page progress report (results/<folder>/brief.html). The numbers are not here:
# `python -m cfdlib.brief` takes them from the case's own result files. Keys: cfdlib/brief.py.
# Simple words, short bullets, no numbers typed by hand.

plane_poiseuille:
  goal: The first case of the project. It checks that the workflow and OpenFOAM reproduce a flow whose exact solution is known.
  story: Solved with OpenFOAM by an agent that followed the workflow. gpucfd did not exist yet. It was run later on the same problem, with the same cells across the gap and the outputs formed in the same way.
  requirements:
    - Water between two very large flat plates, pushed by a constant pressure drop.
    - Slow and steady. The fluid moves in straight layers (laminar flow).
    - "Asked for: the velocity profile across the gap, the largest velocity, the flow rate and the friction on the walls."
    - "Reference: the exact textbook solution, a parabola."
  gpucfd: not run
  record: dev/compare/plane_poiseuille/gpucfd.json
  accuracy:
    note: Differences from the exact solution on the finest grid. The last two rows are zero up to rounding in both tools.
    rows: {a: Velocity profile across the gap, b: Largest velocity, c: Flow rate, d: Friction on the walls}
  speed:
    data: {list: rows, label: "{Ny} cells across the gap", wall: wall}
    note: Each run takes a fraction of a second.
  meaning:
    - The workflow can take a problem statement to a checked report.
    - Both tools reproduce the exact solution to a tiny fraction of a per cent.
    - "The two tools give the same numbers. Across the gap they use the same cells and the same formulas, so they solve the same small set of equations."
    - Neither tool is faster in a way that matters. Every run is over in less than a second.
  limits:
    - "The tools work differently here. OpenFOAM solves the steady flow directly. gpucfd has no steady solver: it starts from rest and steps in time until the wall friction balances the pressure drop."
    - gpucfd's time step was picked in three timed tries, fixed before the runs. The largest try was the fastest, so a still larger step might be faster.
    - OpenFOAM's times are the first, untuned runs on one core. It was not run again.
    - This is the simplest flow there is. Passing it says little about harder flows.

lid_driven_cavity_re100:
  goal: The first comparison with a published benchmark, for a flow that has no exact solution.
  story: Solved first with OpenFOAM. gpucfd was then run on the same problem and the same four grids, each from rest, with the outputs formed in the same way. Its settings were those its own development had measured for this flow. Nothing was tuned for these runs.
  requirements:
    - A square box full of fluid. Its top wall, the lid, slides sideways and drags the fluid round.
    - "Reynolds number 100: slow and steady, with one large vortex."
    - "Asked for: the velocity along the two centre lines, the strongest return flow, and the centre and strength of the vortex."
    - "Reference: the benchmark tables of Ghia, Ghia and Shin (1982)."
  gpucfd: not run
  record: dev/compare/lid_driven_cavity_re100/gpucfd.json
  accuracy:
    note: Differences from the benchmark on the finest grid. The first three rows are shares of the lid speed.
    rows: {a: Velocity along the vertical centre line, b: Velocity along the horizontal centre line, c: Strongest return flow, d: Strength of the vortex}
  speed:
    data: {list: rows, label: "{N} by {N}", cells: "N*N", wall: wall}
    note: Time to reach the steady flow from rest.
  meaning:
    - Both tools agree with the benchmark about as closely as the benchmark's own grid allows.
    - The two tools agree with each other far more closely than either agrees with the benchmark, and the gap between them shrinks four times with each finer grid.
    - On the two finest grids gpucfd reaches the steady flow many times faster than OpenFOAM's first runs did.
    - "By the case's own rules both tools differ from what was expected in the same one place: the benchmark differs from both along the horizontal centre line by more than the limit set before the runs."
  limits:
    - "The speed table overstates the gap. OpenFOAM's times are the solver agent's first, untuned runs on one core, with a very strict stop. It was not run again."
    - "The tools stop by different rules: OpenFOAM when its equations are satisfied to a set level, gpucfd when the flow no longer changes from one time unit to the next."
    - A flow in a plain box suits gpucfd. A flow around a body does not suit it as well (see the cylinder cases).
    - The benchmark is itself a computed solution from 1982 on a coarser grid, not an experiment.

stokes_first_problem:
  goal: The first flow that changes in time, checked against an exact solution.
  story: Solved first with OpenFOAM. gpucfd was then run on the same problem, with the same cells and the same time steps, and its outputs were formed by the case's own code. Nothing was tuned.
  requirements:
    - A flat plate under deep, still water suddenly starts to move along itself.
    - The motion spreads slowly into the water. The first 20 seconds are computed.
    - "Asked for: velocity profiles at three times, the friction on the plate, how deep the motion has reached, and the momentum given to the water."
    - "Reference: the exact solution, known as Stokes' first problem."
  gpucfd: not run
  record: dev/compare/stokes_first_problem/gpucfd.json
  accuracy:
    note: Differences from the exact solution on the finest run.
    rows: {a: Velocity profiles at three times, b: Friction on the plate at the end, c: Depth the motion has reached, d: Momentum given to the water}
  speed:
    data:
      files: [results/stokes_first_problem/runs/N125_dt40ms.json, results/stokes_first_problem/runs/N250_dt20ms.json, results/stokes_first_problem/runs/N500_dt10ms.json, results/stokes_first_problem/runs/N1000_dt5ms.json, results/stokes_first_problem/runs/N2000_dt2.5ms.json]
      label: "{Ny} cells, {steps} steps"
      wall: wall_time
    note: The five runs of the grid study. Cells and time step are halved together from one run to the next.
  meaning:
    - Both tools follow a flow in time to within a few thousandths of a per cent of the exact solution.
    - "Their errors are nearly the same, although they step in time by different methods. Both errors shrink four times when cells and time step are halved, as they should."
    - gpucfd is a few times faster on the finest run and no faster on the coarsest. Every run takes less than a minute, so the difference does not matter here.
  limits:
    - This flow changes in one direction only, across the water layer. It does not test how either tool carries a flow along with itself.
    - "gpucfd ran the five runs of the grid study, not the case's two extra studies (finer cells alone, smaller time step alone)."
    - OpenFOAM's times are the first, untuned runs on one core. It was not run again.

dfg_cylinder_re100:
  goal: The first flow that never settles, vortices shed from a cylinder, against a benchmark. It is also the first case solved with both tools.
  story: Solved first with OpenFOAM on a grid fitted to the cylinder. gpucfd works on a box of cells with the cylinder cut out of it. It was extended for this case (cells clustered near the cylinder, an implicit time scheme) and then run on the same problem.
  requirements:
    - A channel with a fixed round cylinder a little off the centre line. The fluid enters with a parabolic profile.
    - "Reynolds number 100: the wake swings from side to side for ever, and the forces on the cylinder swing with it."
    - "Asked for: the largest, smallest and mean drag, the lift, and the shedding frequency, once the swinging repeats itself."
    - "Reference: the DFG benchmark 2D-2, a very fine finite-element solution."
  gpucfd: none
  accuracy:
    title: "Accuracy: difference from the benchmark"
    note: In per cent, each tool on its finest grid. gpucfd was run with the cylinder at two positions relative to its cells.
    pick:
      file: results/dfg_cylinder_re100/gpu_study.json
      table: Each study's own error estimate
      columns: [0, 2, 3, 5]
      head: [Requirement, "Benchmark's own uncertainty", OpenFOAM, gpucfd]
  speed:
    title: "Speed: a whole grid study"
    note: Time in seconds for all grids of a study, with the drag error it ends at. The star marks an estimate explained in the study report.
    pick:
      file: results/dfg_cylinder_re100/gpu_study.json
      table: Cost of each whole study
      columns: [0, 3, 4]
      head: [Study, Time (s), Drag error at the end (%)]
      rows:
        - OpenFOAM, all four grids, each run stopped when periodic
        - OpenFOAM, first two grids only
        - gpucfd, equal cells
        - gpucfd, clustered, implicit scheme on the finest grid
  meaning:
    - Both tools reach the benchmark's drag within the benchmark's own uncertainty.
    - "For a flow around a body, OpenFOAM's fitted grid is the cheaper way to a given accuracy: it needs far fewer cells."
    - gpucfd is much faster per cell, but it needs many more cells to describe a round cylinder on a grid of boxes.
  limits:
    - gpucfd's lift is less accurate than its drag, and it depends on where the cylinder sits relative to the cells.
    - The benchmark is itself a computed solution. Its own uncertainty is shown in the table.

dfg_cylinder_3d_re20:
  goal: The first three-dimensional case, with up to 2.4 million cells. It also tests whether OpenFOAM's pressure solver gets faster on the GPU.
  story: Solved with OpenFOAM on CPU cores. A separate study moved OpenFOAM's pressure solve to the GPU with OpenFOAM's own plugin. gpucfd was run on the same problem later, on a box of cells with the cylinder cut out of it and the cells made finer around the cylinder along the flow. Its force tool first had to learn a body that touches the walls.
  requirements:
    - A channel of square cross-section with a round cylinder spanning it from wall to wall.
    - "Reynolds number 20: slow and steady, with a small region of reversed flow behind the cylinder."
    - "Asked for: the drag and the lift on the cylinder."
    - "Reference: the DFG benchmark 3D-1Z."
  gpucfd: not run
  record: dev/compare/dfg_cylinder_3d_re20/gpucfd.json
  accuracy:
    note: "Each tool on its finest grid. Band: the share of the allowed difference that is used; above 1 is a miss. Each tool's band comes from its own three finest grids, so a tool whose grids still differ a lot gets a wide band. Compare the differences first."
    rows: {a: Drag on the cylinder, b: Lift on the cylinder}
  speed:
    performance: [L1, L2, L3, L4]
    note: "Neither set of times is a fair measure of speed: OpenFOAM's runs shared the PC with other runs, and gpucfd's ran while another solver used the CPU. gpucfd's grids are named by their cells across the cylinder's diameter; each started from the one before, the first from rest. OpenFOAM's speed study is the separate report."
  meaning:
    - OpenFOAM's drag is right. Its lift, a very small force here, misses the band that was set for it before the runs.
    - "gpucfd's drag is close, but much further from the benchmark than OpenFOAM's (see the table), with more cells and a similar run time. OpenFOAM's cells are wrapped around the cylinder. gpucfd cuts the cylinder out of a grid of boxes, and that costs accuracy at the surface."
    - "gpucfd's lift is not usable on these grids: it changes sign from one grid to the next. The lift is a tiny part of the drag, smaller than the error gpucfd makes at the surface."
    - A second family of OpenFOAM grids showed that the lift depends on how the cells are graded around the cylinder.
    - On this PC, OpenFOAM's pressure solver on the GPU pays off only on the largest grids.
  limits:
    - gpucfd ran three grids of one family, with the cylinder at one position relative to the cells. Its drag is inside its band only because that band is wide.
    - "The 12 GB of the graphics card could hold a finer gpucfd grid of this family, but not one fine enough to match OpenFOAM's drag. That needs fine cells around the cylinder in all three directions, which gpucfd's pressure solver cannot yet handle well in 3D."
    - The lift is tiny compared with the drag, which makes it hard to compute to a per cent.

heated_pipe_re200:
  goal: The first case with heat transfer.
  story: "Solved with OpenFOAM. gpucfd cannot solve it yet: it has no temperature equation and no round pipe."
  requirements:
    - Water flows slowly through a small tube. After an unheated entrance, the wall is heated evenly.
    - Slow and steady (laminar flow).
    - "Asked for: how the heat transfer develops along the tube, its final value, the length of the thermal entrance, and the wall and water temperatures."
    - "Reference: the exact series solution of this problem."
  gpucfd: cannot yet
  accuracy:
    note: Differences from the exact solution on the finest grid. The heat transfer is given as the Nusselt number.
    rows: {a: Heat transfer along the tube, b: Its fully developed value, c: Length of the thermal entrance, d: Wall and water temperature at the end}
  speed:
    performance: [L1, L2, L3, L4]
  meaning:
    - OpenFOAM matches the exact solution of a heat-transfer problem to about a hundredth of a per cent.
    - The numbers agree. Two of the agent's own checks were not fully met, and the full report lists them.
  limits:
    - "gpucfd has no column: heat transfer is not built into it yet."
    - The fluid's properties are constant, and buoyancy was checked on one grid only.

turbulent_flat_plate_sa:
  goal: The first turbulent flow, computed with a turbulence model.
  story: Solved with OpenFOAM on the grids NASA publishes for this test. gpucfd has no turbulence model, so it cannot run this case. For turbulence computed without a model, see the turbulent channel (case 17).
  requirements:
    - Air flows along a thin, smooth flat plate. The layer of slowed air on the plate is turbulent.
    - "The swirls are not computed. A model (Spalart-Allmaras) stands for their effect, and the average flow is computed."
    - "Asked for: the friction on the plate, its drag, and the velocity and model profiles in the layer."
    - "Reference: NASA's Turbulence Modeling Resource, the same model in NASA's own codes."
  gpucfd: cannot yet
  accuracy:
    note: Only the first row has a like-for-like reference (NASA's incompressible runs). The others are compared with NASA's runs at Mach 0.2.
    rows: {a: Friction at the check point, b: Drag of the plate, c: Friction along the plate, d: Velocity profile, e: Model viscosity at its peak}
  speed:
    performance: [G1, G2, G3, G4, G5]
  meaning:
    - OpenFOAM's version of the model gives NASA's answer to a few hundredths of a per cent.
    - That small difference is just outside the estimated grid error, which is the one difference from what was expected.
  limits:
    - "gpucfd has no column: it has no turbulence model, and for this thin-layer kind of flow it is predicted to be slower than OpenFOAM."
    - This checks the model's implementation against other codes. It does not check the model against a real boundary layer.

turbulent_channel_re180:
  script: dev/compare/turbulent_channel_re180/brief.py

shock_tube_sod:
  goal: The first flow with shock waves. Step 1 of 7 on the way to a rotating detonation engine.
  story: "Solved first with OpenFOAM's shock solver, which the project had never used. gpucfd had no solver for a gas whose density changes. One was built the same day and run on the same problem and grids, with its settings chosen by a budget of twelve short runs fixed in advance."
  requirements:
    - A closed tube of air at rest, 1 m long. A thin wall in the middle separates high pressure on the left from low pressure on the right.
    - The wall is removed. A shock wave runs to the right and an expansion to the left. No friction and no heat conduction.
    - "Asked for at half a millisecond: density, velocity and pressure along the tube, the states between the waves, where each wave is, whether mass and energy are kept, and how sharp the computed jumps are."
    - "Reference: the exact solution of this problem."
    - "Pass limits: written by the solver agent before its fine runs."
  gpucfd: not run
  record: dev/compare/shock_tube_sod/gpucfd.json
  accuracy:
    note: "Differences from the exact solution on the finest grid (12 800 cells). The first row is the mean difference along the tube."
    rows: {a: "Density, velocity, pressure along the tube", b: States between the waves, c: "Where each wave is, and its speed", d: Mass and energy kept}
  speed:
    data:
      files: [results/shock_tube_sod/runs/N100.json, results/shock_tube_sod/runs/N800.json, results/shock_tube_sod/runs/N3200.json, results/shock_tube_sod/runs/N12800.json]
      label: "{N} cells"
      detail: "{steps} steps"
      wall: wall_time
    note: Four of the eight grids. Cells and time step are halved together, so each level costs four times the one before. A gpucfd step has three stages, an OpenFOAM step one. In one dimension the GPU is mostly idle, so gpucfd's times measure its overhead, not the card.
  meaning:
    - OpenFOAM's shock solver gets the exact answer to about a hundredth of a per cent, puts every wave in the right place, and keeps mass and energy exactly.
    - "One expectation was not met: the pressure error fell more slowly with the grid than the agent had predicted before its fine runs. The answer itself is accurate."
    - "gpucfd's new solver is two to three times more accurate on the finest grid, in half the time steps."
    - "For the detonation engine: a shock is spread over 2 cells on every grid, and this solver needs half the time step its own examples use, or the pressure rings behind the shock."
  limits:
    - "The two tools were not given the same care: OpenFOAM ran as the solver agent set it up, on one core and not tuned for speed. gpucfd's method was chosen by twelve short tries."
    - "Why OpenFOAM's error in the expansion falls slowly is not explained. gpucfd with the same kind of limiter does not show it, so it belongs to OpenFOAM's solver and not to the limiter."
    - "One dimension and no friction. The time step is not converged: the full report says how much error is left."

shock_diffraction_corner:
  goal: The first flow with shocks in two dimensions. Step 2 of 7 on the way to a rotating detonation engine.
  story: "Solved with OpenFOAM's shock solver by a fresh agent. gpucfd's new shock solver then ran the same problem on the same grids, with its outputs read by the case's own code. Its method was picked by a rule fixed before the runs."
  requirements:
    - A square chamber of still air, 1 m by 1 m. A flat shock wave five times faster than sound enters through the upper half of the left side.
    - Below the opening the left side is a wall, so the shock has to bend round a sharp corner into the lower half. No friction and no heat conduction.
    - "Asked for at 0.45 ms: the speed of the flat part of the shock and the gas behind it, whether mass and energy are kept, whether the flat part stays flat, and the pattern round the corner."
    - "Reference: the exact jump across a shock for the flat part. The pattern round the corner has no exact solution."
    - "Required: the flat part's speed within 0.5 % and the gas behind it within 1 %; mass and energy within 0.01 % of what flowed in; the flat part straight to within one cell."
  gpucfd: not run
  record: dev/compare/shock_diffraction_corner/gpucfd.json
  accuracy:
    note: "On 800 by 800 cells, the finest grid both tools ran. The first three rows are the problem's requirements. The last row has no reference: it compares the picture at two times, which should be the same picture at two sizes."
    rows: {a: "Flat part: shock speed, pressure, density, velocity", b: Mass and energy against what flowed in, c: Flat part stays straight, d: Same picture at two times}
  speed:
    data:
      files: [results/shock_diffraction_corner/runs/N100.json, results/shock_diffraction_corner/runs/N200.json, results/shock_diffraction_corner/runs/N400.json, results/shock_diffraction_corner/runs/N800.json]
      label: "{N} by {N} cells"
      detail: "{steps} steps"
      wall: wall_time
      cores: cores
    note: Cells and time step are halved together, so each level costs about eight times the one before. A gpucfd step has three stages, an OpenFOAM step one. For OpenFOAM, sixteen cores were slower than eight.
  meaning:
    - All three requirements are met with a wide margin. A strong shock on a grid of squares stayed flat, which some other methods are known to get wrong.
    - "Both tools keep mass and energy and move the shock at the exact speed. On the flat part their answers agree to a few thousandths of a per cent."
    - "gpucfd needs about 50 times less time than OpenFOAM on 8 cores for the finest common grid."
    - "For the detonation engine: this flow needs about five time steps per cell, against two in the tube. With half as many, the gas round the corner got a negative pressure and the run broke. Eight cores gave only 2.3 times the speed of one."
  limits:
    - "The speed table is not tuned on OpenFOAM's side: its runs are the solver agent's own, with a time step chosen for safety. gpucfd ran on the GPU of the same PC."
    - "gpucfd is worse in one place: the weak waves left by the start of the shock are about twice as tall as OpenFOAM's."
    - The pattern round the corner is checked only against itself (two times, two grids), not against an experiment.
    - "The start is not clean: the shock is put in as a sharp jump, and two weak waves from that start stay in the flow at about 2 % of the pressure."

h2_air_ignition_box:
  goal: The first case with burning. Chemistry alone, with no flow. Step 3 of 7 on the way to a rotating detonation engine.
  story: "Solved with OpenFOAM's chemistry solver by a fresh agent, which also wrote an independent solution of its own to check both OpenFOAM and the reference. gpucfd had no chemistry. A chemistry kernel for the GPU was built the same day and run on the same parcel. It is not yet joined to gpucfd's flow solver."
  requirements:
    - A parcel of hydrogen, oxygen and nitrogen at rest, suddenly at \(1000\,\mathrm{K}\). The pressure is held at 2 atmospheres and no heat is exchanged.
    - After a short delay the mixture ignites and burns. Nothing flows, so only time matters.
    - "The full hydrogen reaction scheme: 10 species and 27 reactions."
    - "Asked for: temperature against time, the ignition time, the final temperature, the species, whether atoms and energy are kept, and what the chemistry costs."
    - "Reference: an independent chemistry program (CHEMKIN II) with the same reaction scheme."
    - "Required: ignition time within 1 %, final temperature within 0.1 %, the atoms of each element constant within 0.001 %."
  gpucfd: not run
  record: dev/compare/h2_air_ignition_box/gpucfd.json
  accuracy:
    note: "With the smallest time step. The first three rows are the problem's requirements."
    rows: {b: Ignition time, c: Temperature at the end, e: Atoms and energy kept, a: Temperature against time}
  speed:
    data:
      files: [results/h2_air_ignition_box/runs/S2500.json, results/h2_air_ignition_box/runs/S10000.json, results/h2_air_ignition_box/runs/S40000.json, results/h2_air_ignition_box/runs/S80000.json]
      label: "{steps} time steps"
      wall: wall_time
    note: "One cell, with the same very tight tolerance in both tools. Looser settings and a simpler chemistry solver gave OpenFOAM the same answer in under a third of the time. One cell is the wrong job for a GPU: one of its thousands of threads works alone. The last row is what it is for."
  meaning:
    - "All three requirements are met with a wide margin. OpenFOAM agrees with the agent's independent solution about forty times more closely than either agrees with the reference, so what is left is mostly the reference's own accuracy."
    - "One prediction of the agent was wrong: it expected OpenFOAM's shipped example to miss the 1 %. It is inside, at 0.56 %."
    - "For the detonation engine: in OpenFOAM the time step is an accuracy setting of the chemistry, not only of the flow. Halving the step halves the error, and no setting of the chemistry solver removes it."
    - "For the detonation engine: the chemistry of one cell costs about 100 microseconds per time step on one core, and far more while the cell ignites. The flow part cost 0.3 microseconds per cell in step 1. This is why chemistry on the GPU matters."
    - "gpucfd's new chemistry kernel meets the same three requirements. With the same constants it agrees with OpenFOAM to one part in ten million. With a million cells it advances about 200 million cells times steps per second, at the time step a flow solver with shock waves takes."
  limits:
    - "gpucfd is worse for few cells: slower than OpenFOAM for one cell, and no gain below about 10 000 cells."
    - "There is no fair ratio of the two tools' chemistry cost yet. OpenFOAM's chemistry was timed on one cell only; gpucfd's speed is for a million cells at a looser tolerance and in mixed precision."
    - "gpucfd's kernel is chemistry alone, tested with this one reaction scheme. It is not yet joined to the flow solver."
    - "One cell only. The cost per cell in a real flow depends on how many cells are igniting at the same time."
    - "The reference states no accuracy of its own. The agent's independent solution suggests it is good to about 0.03 %."

detonation_tube_h2_air:
  goal: Shock and burning together for the first time. Step 4 of 7 on the way to a rotating detonation engine.
  story: "Solved with OpenFOAM's burning solver by a fresh agent. gpucfd cannot run it yet: its shock solver and its chemistry are both built and tested, but they are not joined. That is the next thing to build."
  requirements:
    - A closed tube, 0.12 m long, of hydrogen and air at rest at 1 atmosphere and \(300\,\mathrm{K}\). Only the distance along the tube matters.
    - "A thin layer at one end (1.5 mm) starts hot and at high pressure. It sends a shock down the tube that ignites the gas behind it: a detonation."
    - "The full hydrogen reaction scheme: 10 species and 27 reactions."
    - "Asked for: the speed of the wave, whether shock and flame travel together, the burnt gas behind the wave, the peak pressure at the front, whether mass, atoms and energy are kept, and the cost."
    - "Reference: the Chapman-Jouguet speed, the one speed a free-running detonation can have. It follows from the gas alone, with no simulation."
    - "Required: wave speed within 2 % of that theory; from 10 microseconds on, the flame within 1 mm of the shock."
  gpucfd: cannot yet
  accuracy:
    note: "On the finest grid, 3200 cells of 0.0375 mm. The first two rows are the problem's requirements."
    rows: {a: Wave speed, b: Flame behind the shock, c: Burnt gas behind the wave, d: Peak pressure at the front, e: "Mass, atoms and energy kept"}
  speed:
    data:
      files: [results/detonation_tube_h2_air/runs/N400.json, results/detonation_tube_h2_air/runs/N800.json, results/detonation_tube_h2_air/runs/N1600.json, results/detonation_tube_h2_air/runs/N3200.json]
      label: "{N} cells"
      detail: "{steps_done} steps"
      wall: wall_time
      cores: cores
    note: "Most of the time is chemistry: on one core about 150 microseconds for each burnt cell, five times in every time step, against under 3 for the flow. Over a full run the flow takes 2 to 9 % of the processor time. Eight cores were only about twice as fast as one."
  meaning:
    - "Both requirements are met with a wide margin, on every grid, the coarsest included. The speed is right even where the front is not resolved, because it follows from keeping mass, momentum and energy and burning the gas completely."
    - "One prediction of the agent was missed by a hair: the peak pressure at the front reaches 0.79 of the full shock pressure on the finest grid, where it expected at least 0.80. The burning zone is thinner than the cells."
    - "For the detonation engine: OpenFOAM's solver does not keep energy by itself. With the setting of its own burning examples it lost 15 % of the heat and the wave ran 17 % too slow. Five passes per time step cut the loss to 0.2 %, at five times the cost."
    - "For the detonation engine: the wave is still settling when the time ends, so finer cells do not bring the speed closer to the theory. The next case needs a longer tube or a later reading."
    - "Chemistry and message passing take over 90 % of the processor time. gpucfd's chemistry kernel advances a burnt cell at this pressure in about 0.06 microseconds on the GPU, so the joined GPU solver is where the speed is to be won."
  limits:
    - "gpucfd has no column: its shock solver and its chemistry are not joined yet."
    - "The 0.06 against 150 microseconds is not a fair ratio: one GPU against one core, a kernel alone against a whole solver, and not the same states."
    - "No grid finer than 3200 cells: the agent cut its plan for cost. The time-step study shows no trend and three small effects stay unexplained."
    - "The reference is a theory value from the scheme's own data. Values in the literature for this mixture may differ by about half a per cent; none was checked."
