# Numerical choices (made by the agent, not given by the user).
solver: pimpleFoam            # transient incompressible laminar solver (PIMPLE, 2 outer correctors)
mesh:
  # Block-structured O-grid around the cylinder inside a square box [0.1, 0.3] x [0.1, 0.3] m, plus
  # 8 rectangular channel blocks. All cell counts scale with nc (cells along one side of the box =
  # cells along a quarter of the cylinder) and double per level: refinement ratio 2 everywhere.
  box: [0.1, 0.3]             # x and y extent of the box around the cylinder [m] (same in x and y)
  levels: [M1, M2, M3, M4]
  nc: [16, 32, 64, 128]       # cells per box side / per quarter circle
  nr_over_nc: 0.5             # radial cells in the O-grid
  radial_ratio: 4.0           # O-grid radial expansion (cell at the box / cell at the cylinder)
  nl_over_nc: 0.5             # cells in x upstream of the box (0 .. 0.1 m)
  nb_over_nc: 0.5             # cells in y below the box (0 .. 0.1 m)
  nt_M1: 9                    # cells in y above the box (0.3 .. 0.41 m) on M1, doubled per level
  nd_M1: 70                   # cells in x downstream of the box (0.3 .. 2.2 m) on M1, doubled per level
  downstream_ratio: 4.0       # downstream expansion (last / first cell)
  dz: 0.01                    # thickness of the 2D slab [m] (empty front/back); force per unit depth = F / dz
time:
  dt_M1: 0.004                # time step on M1 [s]; halved with each mesh level (constant Courant number ~1.6).
                              # Was 0.002 with PISO (1 outer corrector): first order in time, see insight 10 and
                              # the piso_* runs. With 2 outer correctors the M2 answer did not change between
                              # dt = 2, 1 and 0.5 ms, so the larger step is affordable and accurate.
  develop_end: 15.0           # M1 starts from rest and runs 0 .. 15 s (shedding develops)
  run_length: 3.0             # each finer mesh starts from the developed field of the next coarser one
                              # (mapFields) and runs this long [s], ~9 shedding cycles
  run_length_finest: 3.0      # M4: 3 s was projected at 34 min on 8 ranks (over budget); 16 ranks bring it to ~25 min
  cycles_measured: 4          # outputs and periodicity checks use the last 4 complete lift cycles
  write_interval_final: 0.01  # fields written every 0.01 s (~33 per cycle) for the wake picture ...
  keep_writes: 40             # ... keeping only the last 40 (purgeWrite): more than one cycle
timestep_study:               # on M2: same mesh, time step /2 and /4 (baseline dt_M2 is the largest)
  mesh: M2
  factors: [0.5, 0.25]
  start_from: M2              # mapped from the developed M2 baseline field
linear_solvers:
  p: {solver: GAMG, tol: 1.0e-7, relTol: 0.01}      # pFinal: relTol 0
  U: {solver: smoothSolver, tol: 1.0e-8, relTol: 0}
pimple: {nOuterCorrectors: 2, nCorrectors: 2, nNonOrthogonalCorrectors: 1}   # was 1 (PISO): see dt_M1
schemes:
  ddt: backward               # BDF2, second order
  div_U: 'Gauss linear'       # central (second order, no numerical damping of the shed vortices)
parallel:
  cores: {M1: 1, M2: 1, M3: 4, M4: 16}  # MPI ranks for production (M4: 16 hardware threads, fastest in the scaling test)
probes:                       # wake probe (x, y) [m]: second, independent record of the shedding frequency
  - [0.5, 0.2]
preflight:
  end_time_short: 0.1         # 0.1 s of simulated time on M1 and M4 (M4 run from the mapped M1 field)
# Acceptance rules for the verdict, fixed BEFORE looking at production results.
acceptance:
  # Periodic state ("fully developed"): over the last cycles_measured lift cycles, the largest change
  # between consecutive cycles must stay below these values.
  periodic_cl_peak: 2.0e-3    # of the lift maximum and minimum (coefficient units; amplitude ~2)
  periodic_cd_peak: 5.0e-4    # of the drag maximum and minimum (coefficient units; mean ~3.2)
  periodic_period_rel: 5.0e-4 # relative change of the period
  # Time-averaged x-momentum balance of the whole channel (physical check of the force output):
  momentum_balance_rel: 0.01  # |imbalance| / mean cylinder drag force, finest mesh
  # Comparison with FeatFlow level 6 (reference value) for each requested number q:
  #   band = U_sim + U_ref, U_sim = mesh GCI (3 finest meshes) + time-step error estimate (M2 study),
  #   U_ref = largest |level 6 - level 5| over the three level-5 time steps (the reference's own spread).
  #   primary q: |sim_finest - ref| <= band -> ok; <= 2 band -> WARN; else FAIL
  #   secondary q (small differences of large numbers: cd amplitude, cl mean): > 2 band -> WARN only
  primary: [cd_max, cd_min, cd_mean, cl_max, cl_min, cl_amp, St]
  secondary: [cd_amp, cl_mean]
  order_range: [1.0, 3.0]     # observed order of the primary quantities outside -> WARN
  drag_freq_ratio_tol: 0.01   # theory: drag oscillates at twice the lift frequency (|f_D / f_L - 2| / 2)
gpucfd:                       # the same problem on gpucfd (gpu_run.py, cfdlib.gpu), added 2026-11-12
  # Uniform Cartesian grid over the whole channel; the cylinder is an immersed body (gpucfd has no
  # body-fitted grids). n = n_G1 * 2^k, cells nearly square (h_x / h_y = 1.006), D/h = 17.6, 35, 70.
  levels: [G1, G2, G3]
  n_G1: [384, 72]
  scheme: rk3                 # explicit RK3: when these runs were made IMEX with bodies was unstable (it works since
                              # 2026-11-13: clustered.imex below has the same levels with it)
  cfl: 0.8                    # dt = min(cfl h / u_dt, 0.15 h^2 / nu) (gcfd.max_dt); on G3 the viscous limit sets it
  u_dt: 2.25                  # velocity scale for the time step: 1.5 Um
  sample_dt: 0.0025           # forces and probe every 2.5 ms: 133 samples per shedding period, peaks parabola-refined
  force_box: [[0.1, 0.3], [0.1, 0.3]]   # control volume around the cylinder for the force (exact discrete momentum balance)
  pressure_tol_rule: 1.0e-4   # THE RULE for the pressure tolerance, on every level and with either scheme: the loosest
                              # tolerance whose cd and cl stay within this of the strictest (1e-10) run over the same
                              # stretch of developed shedding. Read by gpu_run.py tolcheck and by gpu_study.py.
  pressure_tol: 1.0e-8        # relative tolerance of the pressure solve; tuned on G1, rule fixed before the study: the
                              # loosest of 1e-10, 1e-8, 1e-6, 1e-4 that keeps the rule over 1 s of developed shedding
                              # (OpenFOAM side: tuned GAMG, tol 1e-7).
                              # Result (results/.../gpu_tuning/ptol_G1.json): 1e-8 differs by 2.6e-5 at 1.7x less time per
                              # step; 1e-6 by 7.9e-3 (fails)
  pressure_tol_level: {G3: 1.0e-9}   # ADDED 2026-11-13: the rule above applied on every level over one cycle
                              # (gpu_tuning/ptol_<level>.json; made with an older command, today: gpu_run.py tolcheck
                              # <run> <run whose last field to start from>). G1: 1e-8 by construction;
                              # G2: 1e-8 passes (cd 3.1e-5, cl 3.9e-5); G3: 1e-8 fails in cl (3.9e-4), 1e-9 passes
                              # (1.3e-5, 1.0e-5). G3 was rerun with 1e-9 (gpu_run.py uniform_retol G3); the first
                              # run of 2026-11-12 is kept in gpu_tuning/G3_first_ptol1e-8.
  # Same protocol as the OpenFOAM levels: G1 from rest 0..15 s, each finer level starts from the last
  # field of the next coarser one and runs 3 s. Time-step check: G2 again with dt / 2 (from G1).
  # CHANGED after the first runs (2026-11-12): 3 s were not enough on gpucfd. G1's drag is 16 % low (OpenFOAM's
  # M1 was 0.5 % off), so G2 and G3 were still drifting at the end (G3: cd 3.151, 3.165, 3.173 at t = 19, 20, 21).
  # Each finer run is continued from its saved field with the same time step (gpu_run.py extend) until the
  # case's periodicity rule (acceptance) holds over its last 4 cycles, checked live every second, at most 12 s
  # more. Same result as one longer run; the time counted is the whole run.
  dt_check: {level: G2, factor: 0.5}
  # EVERY gpucfd RUN OF THIS CASE, by the name of its record (results/.../runs/<name>.json). level: the grid
  # (G1..G3 equal cells, C1..C3 clustered, below); variant: a change of the clustered grid or of the cylinder's
  # place (clustered.variants: s, w); scheme: the time scheme when it is not `scheme` above; source: the run
  # whose last field it starts from (none: from rest); dt_factor: a time-step check. gpu_run.py builds a run
  # from its row, and gpu_clustered.py, gpu_imex.py and gpu_study.py pick their runs here (gpu_run.run_spec,
  # runs_where). A new run is a new row; the letters of a name mean nothing to the code.
  runs:
    G1:        {level: G1}
    G2:        {level: G2, source: G1}
    G2_dtx0.5: {level: G2, source: G1, dt_factor: 0.5}
    G3:        {level: G3, source: G2}
    C1:        {level: C1}
    C2:        {level: C2, source: C1}
    C3:        {level: C3, source: C2}
    C1s:       {level: C1, variant: s}                       # check run 1: the cylinder moved half a C3 cell
    C2s:       {level: C2, variant: s, source: C1s}
    C3s:       {level: C3, variant: s, source: C2s}
    C2w:       {level: C2, variant: w, source: C1}           # check run 3: the longer band of fine cells
    C1i:       {level: C1, scheme: imex}                     # the IMEX scheme on the same grids (clustered.imex)
    C2i:       {level: C2, scheme: imex, source: C1}
    C3i:       {level: C3, scheme: imex, source: C2}
    C3wi:      {level: C3, variant: w, scheme: imex, source: C2w}
    C3si:      {level: C3, variant: s, scheme: imex, source: C2s}   # planned, not run
  # Decided BEFORE the runs (2026-11-12):
  #  - accuracy: the case's own rule (acceptance above) applied to G3, with U_sim = GCI of G1..G3;
  #  - same answer as OpenFOAM: |G3 - M4| <= U_G3 + U_M4 (each side's GCI band) for every primary quantity;
  #  - expected: cd_max within 0.3 % and St within 1 % of FeatFlow on G3 (DFG 2D-1 drag was 0.14 % off
  #    at D/h 70); all levels periodic; total GPU time below 5 minutes (OpenFOAM: 42 min wall, M4 on 16 ranks).
  #  - FAIL if a run blows up or a primary quantity is more than 2 bands off.
  clustered:                  # the same problem on grids clustered around the cylinder (gpucfd stretched grids,
                              # stage 2, added 2026-11-13; design, cost estimate and targets: gpucfd/DESIGN.md)
    # Cells of one size h in a band around the cylinder, growing linearly with the distance from the band up to a
    # far-field factor that gpucfd.grids.clustered solves so that n cells fill the channel (4.43 in x, 2.10 in y at
    # every level). n = n_C1 * 2^k, h = D / (D_h_C1 * 2^k): D/h = 35, 70, 140 at the body with 28672, 114688 and
    # 458752 cells (the uniform G levels have D/h 17.6, 35, 70 with nearly the same cell counts).
    levels: [C1, C2, C3]
    n_C1: [256, 112]
    D_h_C1: 35
    band: [[0.10, 0.35], [0.10, 0.30]]   # fine cells: one diameter ahead of the cylinder's centre, 1.5 behind, one to each side
    grow: [0.10, 0.05]                   # distance over which the cells grow to the far-field size, x and y [m]
    max_length: 8.0                      # longest run of a finer level [s] (the stop fixed before the runs)
    target:                              # THE TARGET, fixed before the runs (ROADMAP.md; gpucfd/DESIGN.md "Stretched grids,
      rel: 0.0025                        # stage 2"): mean and maximum drag of the finest level within `rel` of FeatFlow
      wall: 1740.0                       # level 6, in less wall time than OpenFOAM's whole study with the live stop [s]
                                         # (the sum of the estimates in live_stop.json is 1743 s; the target was written
                                         # with the rounded number and is kept as written).
      stage2_rel: 0.005                  # the wider criterion of stage 2 itself ("drag within 0.5 %", below)
    pressure_tol: {C1: 1.0e-8, C2: 1.0e-9, C3: 1.0e-10}
    # CHANGED after the first runs (2026-11-13). C2 and C3 were first run with the 1e-8 tuned on G1. C3 then never
    # passed the periodicity rule in 15 s: the flow had settled after about 2 s, but the drag peaks jittered by
    # +-0.07 % from cycle to cycle (records kept in gpu_tuning/C*_first_ptol1e-8). The tolerance rule above (the
    # loosest tolerance whose cd and cl stay within 1e-4 of the 1e-10 run), applied on each level over one cycle
    # (gpu_tuning/ptol_<level>.json), gives: C1 1e-8 (1.4e-5); C2 1e-9 (1e-8 is off by
    # 6.8e-4 in cl); C3 1e-10 (1e-8 is off by 6.0e-3, 1e-9 by 2.5e-4 in cl). Reason: the explicit scheme updates
    # the pressure by (projection result) / dt, so a fixed relative tolerance means more pressure noise as the
    # time step shrinks. The uniform G3 fails the same check with 1e-8 (cl off by 3.9e-4; 1e-9 passes at 1.42 times
    # the time per step); it was not rerun, so its recorded 201 s would be about 270 s by this rule.
    # Everything else as above: scheme, cfl, u_dt (the time step uses the smallest cell), sample_dt, force_box,
    # pressure_tol. Protocol (gpu_run.py clustered): C1 from rest 0..15 s; each finer level from the coarser one's
    # last field, at least run_length (3 s) and until the periodicity rule holds, checked live every second.
    # Decided BEFORE the runs (2026-11-13, gpucfd/DESIGN.md "Stretched grids, stage 2"):
    #  - cheap question: C2 has the body resolution of G3 (D/h 70). Is the wall time of C1 + C2 below the 315 s of
    #    G1 + G2 + G3 at the same drag error (about -1.0 %)? Expected: no (about 490 s).
    #  - C3: drag within 0.5 % of FeatFlow; its wall time is reported against OpenFOAM's study (about 1740 s).
    #    Timed over 200 steps first; not started above a projection of 45 minutes; stopped if not periodic after 8 s.
    #  - if C2's drag error is more than twice G3's, one variant with a wider band is run on C2 before C3.
    #
    # THREE CHECK RUNS, approved by the student after the first results (2026-11-13). A run with `variant` in the
    # table of runs above is its level with that variant's changes (gpu_run.py clustered C1s C2s C3s / C2w).
    variants:
      s:                                 # the cylinder moved along x by half a C3 cell (a quarter of a C2 cell, an
        x_shift: 3.5714285714e-4         # eighth of a C1 cell): the same flow, the surface cut differently by the grid
      w:                                 # the band of fine cells reaching 4 diameters behind the cylinder's centre
        band: [[0.10, 0.60], [0.10, 0.30]]   # instead of 1.5; 320 x 112 on C1 keeps the far-field factor (4.56 against 4.43),
        n_C1: [320, 112]                 # so C2w has 640 x 224 = 143360 cells (25 % more than C2)
    # Written BEFORE these runs. Every run stops as above (at least 3 s, then at the first periodicity check that
    # passes, at most 8 s) and uses the tolerance of its level.
    #  1. C1s, C2s, C3s: the whole protocol with the shifted cylinder. Question: is C3's drag error (-0.09 % mean,
    #     -0.11 % maximum) typical, or a lucky cut? Reading: if C3s is also within 0.25 % of FeatFlow in both, the
    #     target holds on both cuts and what may be quoted is the range of the two runs. If C3s is outside 0.25 %,
    #     the target was met on one cut only and the answer to quote is the range, with that said. Expected from the
    #     steady study (0.23 points of scatter at D/h 35, falling at order 1.5 to 2): C3s within 0.05 points of C3,
    #     C2s within 0.1 points of C2. Two cuts give a range, not a distribution.
    #  2. G3 with the tolerance its rule gives (gpucfd.pressure_tol_level below; G2 is checked first and rerun too if
    #     it fails the rule). Question: what is the uniform protocol's time when it follows the same tolerance rule
    #     as the clustered one? Expected: the same drag (within 1e-3 of the first run), G3 about 270 s, protocol
    #     about 385 s. The first runs are kept in gpu_tuning/G*_first_ptol1e-8.
    #  3. C2w from C1's field. Question: are C2's worse lift and Strouhal number (-5.15 % and +0.54 %, against
    #     G3's -3.36 % and +0.29 %) caused by the larger cells behind the cylinder? "Recovered" if the lift
    #     maximum is within 3.7 % and the Strouhal number within 0.35 % of FeatFlow (G3's errors plus a tenth);
    #     "no effect" if both stay within 0.3 and 0.05 points of C2's; otherwise "partly". The shifted C2s shows how
    #     much of such a difference the cut alone can make, so C2w is read against that.
    # OUTCOME (2026-11-13, results/.../gpu_clustered.json, gpucfd/DESIGN.md "Check runs"):
    #  1. C3s: drag -0.16 % mean, -0.19 % maximum (C3: -0.09 %, -0.11 %), periodic after 3 s, protocol 1375 s. Inside
    #     0.25 % on both cuts: the target holds on both; to quote: 0.1 to 0.2 % (two cuts). The difference is 0.07
    #     points, a little more than the 0.05 expected. C2s: -1.16 % (C2: -1.07 %), as expected.
    #  2. G2 passes the rule with 1e-8. G3 with 1e-9: the same coefficients, 214 s (periodic after 4 s instead of 5,
    #     from a G2 field 2 s older than the first time), protocol 328 s: less than the 385 s expected.
    #  3. C2w: lift maximum -3.68 %, Strouhal +0.25 %, drag -0.94 %: recovered. C2s moves the lift by 0.2 points and
    #     the Strouhal number by 0.02, so this is the band, not the cut. Cost: 143360 cells, periodic after 4 s,
    #     196 s; protocol 308 s against the uniform 328 s.
    #
    # THE IMEX SCHEME ON THESE LEVELS (gpucfd stage 3, added 2026-11-13; cause, design and criteria:
    # gpucfd/DESIGN.md "IMEX with immersed bodies"). The runs with `scheme: imex` in the table of runs above (their
    # names end in i) use implicit diffusion: the time step is cfl h / u_dt alone, without the viscous limit
    # (C1 1.02e-3 as before, C2 5.08e-4 instead of 3.06e-4, C3 2.54e-4 instead of 7.65e-5).
    # Both schemes solve the same discrete steady equations; in time IMEX is second order, RK3 third.
    imex:
      pressure_tol: {C1: 1.0e-9, C2: 1.0e-9, C3: 1.0e-10}   # per level, by the rule above (cd and cl within 1e-4 of
                                         # the 1e-10 run over one cycle), found with cfdlib.gpu.tolerance_check from the
                                         # explicit run's last field before each level was run (gpu_run.py tolcheck
                                         # <level>i <source run>, gpu_tuning/tol_<level>i.json). Largest difference with
                                         # 1e-9 / 1e-8: C1i 1.8e-5 / 1.2e-4, C2i 1.8e-5 / 1.7e-3, C3i 2.2e-4 / 1.2e-3.
                                         # So IMEX needs the explicit scheme's tolerances or tighter (C1: 1e-9 against
                                         # 1e-8), not looser ones as DESIGN.md expected: its shortest substep, 2/15 of
                                         # the step, is only 1.8 times the explicit scheme's (1/4 of a step 3.3 times
                                         # shorter). ms per step at 1e-10 / 1e-9 / 1e-8: C1i 13.6 / 11.3 / 8.4,
                                         # C2i 24.8 / 20.8 / 15.6, C3i 62.5 / 48.8 / 33.6.
      # THE SAME-ANSWER RULE (point 1 below), relative to the explicit run's value on the same grid; read by gpu_imex.py
      same_answer: {cd_mean: 5.0e-4, cd_max: 5.0e-4, St: 5.0e-4, cl_max: 3.0e-3, cl_amp: 3.0e-3}
      expected_study_wall: [550.0, 800.0]   # the study time expected before the scheme was built (point 2 below) [s]:
                                         # a statement made in advance, which the report only compares with the result
    # Written BEFORE the runs (2026-11-13). Protocol as above: C1i from rest 0..15 s; C2i from C1's last field and
    # C3i from C2's (the explicit runs' fields: the same start as their explicit twins), at least 3 s and until
    # the periodicity rule holds, at most 8 s. Analysis: gpu_imex.py -> gpu_imex.json (the explicit records and
    # gpu_clustered.json are not touched).
    #  1. Same answer? Each IMEX level against the recorded explicit run on the same grid: mean and maximum drag
    #     and the Strouhal number within 0.05 % of the value, lift maximum and amplitude within 0.3 %. For scale:
    #     moving the cylinder half a cell moves C3's drag by 0.07 % and its lift maximum by 0.3 %. A level that
    #     misses is rerun with half the time step: if the halved run moves toward the explicit one by about a
    #     factor 4, the difference is IMEX's time error and the level needs that step; otherwise it is reported as
    #     a different answer.
    #  2. Wall time of the three-level study against 1421 s (explicit) and about 1740 s (OpenFOAM). A level may
    #     use the scheme that is faster on it. Expected (DESIGN.md): C3i 300 to 530 s against C3's 1180 s; C1 and
    #     C2 stay explicit (their viscous limit is not below the convective one by enough to pay for the dearer
    #     step); study 550 to 800 s. C3i is timed over 200 steps first and not started above a projection of
    #     20 minutes.
    #  3. If time allows: C3wi (the longer band of fine cells, from C2w's field): lift maximum expected below
    #     1 % from FeatFlow; and C3si (the cylinder moved half a cell, from C2s's field), so that the drag is
    #     quoted with its spread over two positions.
    # OUTCOME (2026-11-13, results/.../gpu_imex.json, gpucfd/DESIGN.md "IMEX with immersed bodies"):
    #  1. Same answer on all three levels: drag and Strouhal number within 0.001 %, lift within 0.014 % (C1i),
    #     0.003 % (C2i), 0.002 % (C3i). No level had to be rerun.
    #  2. C3i 764 s against C3's 1180 s (3.3 times fewer steps, 2.1 times the time per step). Study C1 + C2 + C3i
    #     1005 s; all three with IMEX 1085 s (C1i 187 s against 112 s, C2i 134 s against 129 s). The expectation
    #     (C3i 300 to 530 s, study 550 to 800 s) was missed: the tolerance did not relax and the step is dearer.
    #  3. C3wi: lift maximum -0.69 %, amplitude -0.94 %, Strouhal +0.07 %, drag -0.12 / -0.10 %; 1001 s, study
    #     C1 + C2w + C3wi 1308 s. Its tolerance is C3i's (not checked on this grid). C3si was not run.
sensitivity:                  # extra run on M3: linear-upwind convection instead of central
  mesh: M3
  div_U: 'Gauss linearUpwind grad(U)'
