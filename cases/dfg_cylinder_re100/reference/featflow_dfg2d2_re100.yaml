# Reference data parsed by code from the FeatFlow benchmark page (tables 1-3). Do not edit by hand.
source: 'FeatFlow group (TU Dortmund), ''DFG benchmark 2D-2 (RE100, periodic)'', http://www.featflow.de/en/benchmarks/cfdbenchmarking/flow/dfg_benchmark2_re100.html,
  retrieved 2026-11-11. Benchmark defined in: Schaefer, Turek, ''Benchmark computations of laminar flow around a
  cylinder'', Flow Simulation with High-Performance Computers II, Notes on Numerical Fluid Mechanics 52, 547-566,
  Vieweg 1996.'
method: 'Finite elements Q2/P1disc in space, no stabilisation; Crank-Nicolson in time with time step k = 1/100,
  1/200, 1/400; mesh levels 3-6 by regular refinement (level 6: 133120 elements, 667264 unknowns). Values from one
  shedding cycle [t0, t1] between t = 25 s and 30 s; t0 = time of minimum lift; mean = (max+min)/2, amp = max-min.'
notes:
- The frequency 1/f in these tables is resolved only to about the time step k, so St differs between rows in steps
  set by k (e.g. 0.30303 for 1/f = 0.33 s). Treat its spread as part of the reference uncertainty.
- 'No single ''exact'' value: the spread between levels and time steps indicates the reference''s own uncertainty.'
