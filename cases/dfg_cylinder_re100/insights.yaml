- id: 4
  stage: preflight
  logged: 2026-11-11 00:58
  status: resolved
  problem: 'First pre-flight crashed at once on both meshes: FOAM FATAL IO ERROR ''Entry valueExpr not found'' for
    the parabolic inlet. I had written the exprFixedValue condition with the keyword ''expression'' from memory;
    v2606 wants ''valueExpr''. No tutorial in v2606 uses exprFixedValue for U, and the primer does not mention how
    to impose a non-uniform inflow profile. Also my pre-flight wrapper crashed afterwards because the M4 log did
    not exist (decomposePar had failed first).'
  diagnosis: In ESI v2606 the exprFixedValue boundary condition reads its expression from the keyword valueExpr
    (a quoted string), not expression; the error message names the missing keyword, so the fix took one look. The
    wrapper crash was my own code assuming the solver had started.
  fix: 'valueExpr with the parabola in terms of pos().y(); a guard in the pre-flight that stops with a clear message
    if the solver log is missing. Checked the result instead of trusting it: the inflow rate on M1 is \(4.1019 \times
    10^{-3}\) against the exact \(U_{\mathrm{mean}} H\,\Delta z = 4.1 \times 10^{-3}\), a relative excess of \(4.6
    \times 10^{-4}\), exactly the midpoint-rule error \(\Delta y^2/(2H^2)\) predicted for face-centre values; on
    M4 it is 64 times smaller. Cost about 5 minutes.'
  lesson: Boundary conditions written from memory need a one-step test; and a quantity with a known exact value
    (here the inflow rate) is the cheapest check that a non-uniform inlet is right.
  guideline: 'openfoam-primer.md: add a short recipe for a non-uniform inlet profile without compilation (exprFixedValue
    with valueExpr and pos()), and suggest checking the patch flow rate (surfaceFieldValue sum of phi) against the
    exact value in the pre-flight.'
  resolved: 2026-11-11 01:00
- id: 5
  stage: production
  logged: 2026-11-11 01:02
  status: resolved
  problem: 'Two output surprises on the first production run (M1): (1) the forces function object in v2606 writes
    force.dat as nine scalar columns (total, pressure, viscous x y z), not as bracketed vectors, so my reader (written
    like the worked examples for vector outputs) failed; (2) surfaceFieldValue areaNormalIntegrate of the scalar
    p printed exactly 0 at every step on the inlet, silently: the pressure term of my momentum balance would have
    been missing.'
  diagnosis: The v2606 forces function object writes nine plain columns per line (the header names them); cfdlib.foam.read_dat
    returns them as separate floats, so indexing as vectors failed loudly. The areaNormalIntegrate operation is
    meant for vector fields (it dots with the face normal); for a scalar it wrote zeros without any warning. Caught
    only because I printed the first lines of every .dat file before writing the analysis.
  fix: Reader takes columns 1-3 (total), 4-6 (pressure), 7-9 (viscous); pressure at inlet and outlet now uses areaIntegrate
    (the patches are planes with known normals, so the x-force is minus or plus the integral). M1 (56 s) was re-run
    with the corrected function object. Cost about 5 minutes.
  lesson: 'Look at the raw output of every function object after the first short run, before writing analysis code:
    a silent zero is worse than a crash.'
  guideline: 'SKILL.md stage 3: add ''print the header and first rows of every postProcessing file of the pre-flight
    run and check each is non-trivial''; openfoam-primer.md: note the forces.dat column layout in v2606 and that
    areaNormalIntegrate of a scalar returns 0 (use areaIntegrate).'
  resolved: 2026-11-11 01:12
- id: 6
  stage: analysis
  logged: 2026-11-11 01:04
  status: resolved
  problem: 'Cycle periods measured between consecutive lift minima (the FeatFlow definition, t0 = time of minimum
    lift) jittered by up to \(0.4\,\%\) from cycle to cycle on M1 (0.3589 to 0.3625 s) although the run was clearly
    periodic: this would have failed my own periodicity rule (\(5 \times 10^{-4}\)). Periods between upward zero
    crossings of the lift were constant to 4 digits (0.3618 s) and agree with the FFT peak and the wake probe.'
  diagnosis: The lift minimum is broad and flat, so the time of its discrete minimum (even parabola-refined) moves
    by a few time steps from cycle to cycle; a period measured between minima inherits that jitter. Upward zero
    crossings sit on the steepest part of the signal and are located to a tiny fraction of a step by linear interpolation.
  fix: Cycles are now delimited by upward crossings of the lift through its mid-range; peak values are taken inside
    each full cycle (the same values as for a minimum-to-minimum cycle). Period from crossings, cross-checked against
    the FFT of the lift and of the wake probe. Cost about 10 minutes.
  lesson: Define cycle boundaries and periods where the signal is steep, not at its extrema; and cross-check a frequency
    by two independent methods.
  guideline: Add a small cfdlib helper for periodic signals (cycles from zero crossings, parabola-refined peaks,
    FFT cross-check, cycle-to-cycle periodicity check), since every shedding or oscillating case needs the same
    code.
  resolved: 2026-11-11 01:12
