    error left in the pressure by a fixed tolerance then weighs more in the forces. The divergence indicator was
    six times that of the uniform runs. The same-answer rule of insight 17, applied on each level, gives \(10^{-8}\),
    \(10^{-9}\) and \(10^{-10}\) for 35, 70 and 140 cells per diameter. The finest uniform run of 2026-11-12 also
    fails it slightly with \(10^{-8}\) (lift off by \(3.9 \times 10^{-4}\)); it was rerun with \(10^{-9}\).'
  fix: 'Tolerance per level in numerics.yaml (gpucfd.clustered.pressure_tol); the rerun settled in 3 s of flow.
    The stricter tolerance doubles the cost of a step. The run length limit is now inside the run, so a run that
    does not settle stops by itself and keeps its record.'
  lesson: A solver tolerance tuned on a coarse level is not valid on a finer one when the time step shrinks faster
    than the cell size. A stop that can only be applied by killing the run, losing its record, will not be applied.
  guideline: 'workflow/WORKFLOW.md, gpucfd as the solver: tune pressure_tol on every level, the finest included
    (cfdlib.gpu.tolerance_check). cfdlib.gpu.run_transient keeps a partial record of a run that is interrupted.'
