- id: 9
  stage: performance
  logged: 2026-11-11 01:16
  status: resolved
  problem: 'Pressure linear-solver test on M3 (53728 cells, 1 core, 200 steps from the developed flow): GAMG with
    relTol 0.01 is the fastest (2.43 wall microseconds per cell per step, 4.4 iterations per solve); PCG with DIC
    needs 182 iterations per solve and is 4.0 times slower; GAMG with relTol 0 in the first corrector is 1.7 times
    slower; tolerance \(10^{-6}\) instead of \(10^{-7}\) saves only 8 %. All variants give the same drag force to
    within \(1.5 \times 10^{-6}\) (relative) after 200 steps.'
  diagnosis: 'The pressure equation dominates the cost; multigrid (GAMG) needs about 4 to 6 iterations per solve
    where diagonal-incomplete-Cholesky PCG needs about 180 on 54k cells, and that gap widens with mesh size. A loose
    relative tolerance in the first of the two pressure correctors is enough because the final corrector is solved
    fully (relTol 0); demanding relTol 0 everywhere doubles the iterations with no change in the forces. Note: this
    test ran with one outer corrector (before insight 10); the relative comparison of pressure solvers carries over.'
  fix: Kept GAMG, tolerance \(10^{-7}\), relTol 0.01 / pFinal 0 (the tutorial's pattern). No change needed.
  lesson: For transient incompressible runs on this machine GAMG is the right CPU baseline; the solver tolerance
    is not a useful speed lever (8 % for a decade).
  guideline: 'SKILL.md performance section: a GPU test should compare against GAMG (not PCG) and report pressure
    iterations and time per pressure solve separately; record that PCG is 4 times slower here so nobody benchmarks
    a GPU against a weak CPU baseline.'
  resolved: 2026-11-11 01:41
- id: 10
  stage: production
  logged: 2026-11-11 01:22
  status: resolved
  problem: 'Time-step study on M2 (same mesh, PISO with one outer corrector, backward): the lift amplitude is 2.532,
    2.296 and 2.180 for dt = 2, 1 and \(0.5 \times 10^{-3}\) s. The changes (0.236, then 0.116) halve with dt: FIRST-order
    convergence in time, and the time error at the planned dt (Courant number 0.8) is about 10 times larger than
    the reference spread. The mesh family M1-M3 (h and dt halved together) also converges slowly (changes 0.161,
    0.140). Stopped the just-started M4 run (25 min) before it wasted the budget.'
  diagnosis: 'PISO (PIMPLE with one outer corrector) convects the new velocity with the face flux of the previous
    step: the nonlinear term is lagged by one step, an \(O(\Delta t)\) splitting error, so the solution is first
    order in time although the backward scheme is second order. Confirmed with five extra M2 runs from the same
    start: PISO gives a lift amplitude of 2.532, 2.296, 2.180, 2.122 for dt = 2, 1, 0.5, 0.25 ms (changes halving:
    first order, extrapolating to about 2.06), while PIMPLE with 2 outer correctors gives 2.057, 2.056, 2.058 for
    dt = 2, 1, 0.5 ms (no measurable dt dependence) and 3 outer correctors changes it by only 0.001. The worked
    examples did not meet this because case 3 is linear (no convection) and case 2 is steady. Cost: about 25 minutes
    (the PISO family M1-M3 and the time-step study had to be redone; the M4 run was stopped after a minute).'
  fix: nOuterCorrectors 2 (cost per step about 1.9 times PISO) with the time step doubled (Courant number about
    1.6), so the total cost is unchanged; whole chain M1-M4 re-run. The PISO runs are kept (piso_*) as evidence
    for the report.
  lesson: 'For a transient NONLINEAR flow, run the time-step study early, on a cheap mesh, before the mesh family:
    a first-order time error can hide behind dt proportional to h and look like slow mesh convergence. PISO with
    one outer corrector is only first order in time.'
  guideline: 'openfoam-primer.md: add a pitfall ''PISO (nOuterCorrectors 1) is first order in time for nonlinear
    flows; use 2 outer correctors (PIMPLE) when forces or frequencies must be time-accurate, and check with a 3-point
    time-step study before the mesh study''; SKILL.md stage 3: for transient nonlinear problems, make a short time-step
    study part of the pre-flight.'
  resolved: 2026-11-11 01:31
- id: 11
  stage: report
  logged: 2026-11-11 01:31
  status: resolved
  problem: 'Repeated the Stokes case''s insight 10: a Python patch script fed through a Git Bash heredoc turned
    LaTeX in decisions.yaml into a TAB character (the backslash-t of times) despite the doubled backslashes; Python
    printed SyntaxWarnings about invalid escapes, which I noticed only afterwards. Found by grepping the file.'
  diagnosis: 'Root cause found later: the Bash tool on this machine collapses a double backslash to a single one
    even inside a quoted heredoc (tested: a heredoc containing two backslashes and t prints one backslash and t).
    Python then reads a single backslash followed by t as a tab. So any LaTeX in a heredoc-fed script is corrupted,
    whatever the quoting. It happened a second time in analyze.py (a to-arrow became tab-o) before I found the cause.'
  fix: Found the two tab characters with grep, repaired them with the Edit tool, and re-checked the file for control
    characters. About 3 minutes.
  lesson: Never patch LaTeX-containing files through shell heredocs; use the Edit tool, and grep for control characters
    after any scripted edit.
  guideline: 'Put the rule in SKILL.md itself (not only in an old case''s insights): ''edit files that contain LaTeX
    only with the Edit tool''; cfdlib.contract could flag control characters (tab, bell, form feed) in decisions.yaml
    and results text.'
  resolved: 2026-11-11 01:32
