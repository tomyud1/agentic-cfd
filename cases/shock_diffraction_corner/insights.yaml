- id: 4
  stage: tooling
  logged: 2026-11-15 09:59
  status: resolved
  problem: 'The first pre-flight stopped with "Invalid first character found" in <code>system/controlDict</code> at the <code>endTime</code> line.'
  diagnosis: '<code>monitor.preflight</code> was given the short end time as a string (<code>repr(...)</code>), as the worked example of case 18 does. <code>monitor.set_end_time</code> writes the argument with <code>!r</code>, so a string arrives in the file with quotes round it. The solver''s failure is caught by <code>preflight</code> as a finding, so the error only surfaced at my next command on that case.'
  fix: 'Passed the end time as a number.'
  lesson: 'A helper that accepts a number or a string in one version and only a number in the next breaks the worked examples silently.'
  guideline: 'In <code>cfdlib.monitor.set_end_time</code>, write <code>float(end_time)</code> with <code>repr</code>, so that a string and a number give the same file. Update <code>cases/shock_tube_sod/run.py</code>, which still passes a string and would fail the same way if run again.'
- id: 5
  stage: preflight
  logged: 2026-11-15 10:02
  status: resolved
  resolved: 2026-11-15 10:09
  problem: 'The time-step study''s largest step (2.55 steps per cell, a Courant number of 0.4 along \(x\)) stopped with a floating-point exception at \(t = 0.205\,\mathrm{ms}\) on the 200-cell grid: the square root of a negative number. The planned step is only half of that, and finer grids reach lower pressures at the corner.'
  diagnosis: 'The gas that turns round the corner expands to a very low pressure (Theory: far below \(p_0\) if it followed the wall). There the pressure is a small difference of two large numbers, total energy minus kinetic energy, and one explicit Euler step that is too long makes it negative. The solver''s own Courant number, which adds both directions, had reached 0.63; its tutorials use a limit of 0.2. In the pre-flight the lowest pressure fell with the cell size (61 and 34 kPa on 100 and 200 cells, 18 kPa on 400 cells at the larger step), so the margin looked set to shrink with refinement. (The production runs later gave 23 kPa on both 400 and 800 cells at the main step: it stopped falling.) The short test on the finest grid could not show this: after 2 % of the time the corner flow has hardly formed.'
  fix: 'Added a step between the two (a Courant number of 0.3) to the study, and a stress run: the 400-cell grid at 1.5 times the main step. Both ran to the end, healthy, with the same answers as the main step. The main step (0.2) was kept, with a measured margin of 1.5 on the grid next to the finest. <code>run.py</code> now records a run that the solver stops as a result (when, at what Courant number), not as an error of the script.'
  lesson: 'In a flow with a strong expansion the largest stable time step is set by positivity at the lowest pressure, not by the shock, and it gets smaller as the grid gets finer. A short pre-flight on the finest grid does not see it. A full run at a larger step on the grid one level below the finest does, at an eighth of the cost.'
  guideline: 'Add to the primer, "Compressible flow with shocks": "A strong expansion (flow round a corner, a wake behind a step) can stop <code>rhoCentralFoam</code> with a negative pressure well below the step at which a shock tube rings. Measure the margin: run the grid below the finest in full at 1.5 times the planned step. In two dimensions the solver''s printed Courant number adds both directions; keep it near the tutorials'' 0.2 to 0.3." A helper in <code>cfdlib.monitor</code> that records the lowest pressure and density per step (a <code>fieldMinMax</code> function object and its reader) would show the margin shrinking while a run is still going.'
- id: 6
  stage: performance
  logged: 2026-11-15 10:02
  status: resolved
  resolved: 2026-11-15 10:09
  problem: 'On the finest grid (640 thousand cells) 8 cores are only 2.3 times faster than one, and 16 are slower than 8.'
  diagnosis: 'Measured after start-up on the same 82 steps: 0.377, 0.185, 0.165 and 0.200 seconds per step on 1, 4, 8 and 16 cores. Four cores already give a factor 2.0, eight add little. The solver builds many temporary fields over all faces on every step, so the work is moving memory, and the memory of this PC is shared by all cores. The first projection I printed used the wall time of the whole short run, start-up included, and was 10 % too high.'
  fix: 'Ran the finest grid on 8 cores. The timing test now takes the seconds per step from the second half of the short run.'
  lesson: 'For this explicit solver on this PC, cores beyond four buy almost nothing; the cost of a finer answer has to come down by other means (a solver that keeps its data on a GPU, or cells only where the waves are).'
  guideline: 'In the primer''s "Parallel runs", add the measured scaling of <code>rhoCentralFoam</code> next to the incompressible ones. In <code>monitor.preflight</code>, return the seconds per step after start-up next to the projection, so that a timing test of a short run does not count the start-up.'
- id: 7
  stage: preflight
  logged: 2026-11-15 10:00
  status: resolved
  resolved: 2026-11-15 10:10
  problem: 'The solver printed a largest Courant number of 0.28 where I had set a Courant number of 0.2, and my own pre-flight check of it gave a warning.'
  diagnosis: 'Two things. The solver''s number is half the sum, over the faces of a cell, of the larger one-sided flux speed. In two dimensions that adds both directions: behind this shock it is \((u_2 + c_2/2)\,\Delta t/h\), and more where the gas turns round the corner. So here it is larger than the usual Courant number along one direction, the opposite of case 18''s one-dimensional finding (half). And my check compared the largest value in the field with the value of one uniform state, which cannot agree.'
  fix: 'The check now reports the three numbers side by side and warns only above 0.5. The time step was then judged by the time-step study, not by this number.'
  lesson: 'The printed Courant number of <code>rhoCentralFoam</code> has no fixed relation to the usual one: half of it in a one-dimensional subsonic flow, well above it in a two-dimensional supersonic one. A time step chosen as "the usual Courant number 0.2" sat at 0.28 in the solver''s measure, above its tutorials'' limit of 0.2.'
  guideline: 'Extend the note that <code>monitor.assess</code> prints for this solver: "in two or three dimensions the number adds the directions". In the primer, give the rule of thumb in the solver''s own measure (keep the printed number at 0.2 to 0.3), not in the usual one.'
- id: 8
  stage: analysis
  logged: 2026-11-15 10:04
  status: resolved
  resolved: 2026-11-15 10:22
  problem: 'The pressure behind the flat shock, which should be uniform, ripples by 1.4 to 1.9 % on every grid, and the density by 2 to 3 %.'
  diagnosis: 'Two thin waves, not noise. The shock starts as a sharp jump at the opening; while the method spreads it over two to three cells it sends off a sound wave and leaves a spot of wrong density in the gas. Theory says where they must be: at \((u_2 - c_2)\,t\) and at \(u_2 t\). That is where they are, on every grid and at every time step. Their height does not fall with the cell size or the time step; their width is a fixed number of cells. Along the shock the pressure is uniform to one part in a million, so this is no instability of the shock.'
  fix: 'Reported as what it is, with the predicted positions drawn in the figure. The rule for the ripple (2 %) was sized from the pre-flight, where the waves were already there.'
  lesson: 'A captured shock that starts sharp leaves start-up waves that refinement does not remove. A check of "uniform behind the shock" must either expect them or separate the direction along the shock (where an instability shows) from the direction along the flow (where the start-up waves are).'
  guideline: 'Add to the primer, "Compressible flow with shocks": "A shock that starts as a sharp jump leaves two start-up waves behind, at \((u - c)\,t\) and \(u\,t\) from its start, about 2 % high and a few cells wide on any grid. Measure transverse uniformity separately." A helper <code>verification.startup_waves(u, c, t)</code> could return their positions for marking in figures.'
- id: 9
  stage: tooling
  logged: 2026-11-15 10:17
  status: resolved
  resolved: 2026-11-15 10:18
  problem: '<code>plots.to_svg</code> refused a figure: "legend covers data line", though the legend was below the axes and no line was drawn there.'
  diagnosis: 'The line held points outside the axis limits (I had only narrowed the limits). The picture clips them; the layout check tests the whole path.'
  fix: 'Plotted only the points inside the limits.'
  lesson: 'The layout check sees data that the reader does not.'
  guideline: 'In <code>cfdlib.plots.check_layout</code>, clip each line to the axes box before testing it against the legend and the texts.'
- id: 10
  stage: analysis
  logged: 2026-11-15 10:12
  status: resolved
  resolved: 2026-11-15 10:22
  problem: 'I had named the line inside the bent shock "the contact surface" from memory of the literature, and meant to describe it as a jump in density.'
  diagnosis: 'Measured where it crosses \(y = 0.6\,\mathrm{m}\): the density ratio across eight cells is 1.21, 1.13 and 1.08 on 100, 200 and 400 cells per side, and the pressure ratio goes to 1. A true jump would keep its ratio. So on these grids it is a steep but smooth change: the border between gas that crossed the flat shock and gas that crossed the weaker bent shock, where the shock''s strength changes smoothly.'
  fix: 'The report calls it the inner border, gives the measured ratios, and says what the literature calls it.'
  lesson: 'A name from the literature is a claim about the flow. Measure the property the name implies (here: a jump that keeps its size under refinement) before using it.'
  guideline: 'Workflow, stage 5, next to "An explanation is a claim": "So is the name of a flow feature. Check the property it implies against the data, on at least two grids."'
