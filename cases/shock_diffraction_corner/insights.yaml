- id: 12
  stage: analysis
  logged: 2026-11-15 10:29
  status: resolved
  resolved: 2026-11-15 10:31
  problem: 'Two things I had written before the finest run turned out wrong when it arrived: that the density along the line \(y = H_s\) would not settle with the grid, and that the lowest pressure falls with every refinement. The draft report, written from three grids, said both.'
  diagnosis: 'Along the line the two-times difference is 1.4, 0.9 and 0.6 % on 200, 400 and 800 cells: it falls. The layer from the corner starts on that line but leaves it at once, downwards; I had not looked where it goes. The lowest pressure is 61, 34, 23 and 23 kPa: it stopped falling. Both statements were extrapolations from two or three points, written as facts.'
  fix: 'The report now gives the measured values and says what I had expected. The sentences are built from the numbers, not typed. The rule file keeps my wrong reason for having no rule on that line, as written before the runs.'
  lesson: 'Text drafted from partial results is a prediction. After the last run, read every sentence of the draft against the final numbers; a search for the superseded numbers does not find a superseded claim.'
  guideline: 'Workflow, stage 7, where it says to render a draft from partial results: "Mark every sentence of the draft that states a trend. After the finest run, check each against the final data, or build it from the data so that it cannot go stale."'
- id: 13
  stage: tooling
  logged: 2026-11-15 10:30
  status: resolved
  resolved: 2026-11-15 10:31
  problem: '<code>verification.level_sequence</code> called the convergence of the wall-shock distance plausible with an observed order of 3.4, and gave a Richardson value for it.'
  diagnosis: 'The changes are +2.3 %, +0.65 % and +0.06 %: the last one is small because the value is already within the reading rule''s resolution (a fraction of a cell), not because the method is of third order. The function only rejects orders that are too low.'
  fix: 'The report gives the changes and says that the last change, not the extrapolated value, is the measure of what is left.'
  lesson: 'An observed order far above the method''s formal order is as much a warning as one far below it.'
  guideline: 'Give <code>level_sequence</code> an optional <code>p_max</code> (the formal order plus a margin) and return <code>plausible: False</code> above it, as it does below <code>p_min</code>.'
