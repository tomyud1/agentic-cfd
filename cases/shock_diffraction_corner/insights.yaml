# Workflow insights, logged LIVE (cfdlib/insights.py). One entry per problem, surprise or retry:
#   id, stage, logged (real time first met), status (open | resolved), problem,
#   then when solved: diagnosis, fix, lesson, guideline (the change to the workflow that would have prevented it).
# stage: intake | theory | setup | preflight | production | analysis | report | tooling | performance

- id: 1
  stage: intake
  logged: 2026-11-15 09:50
  status: resolved
  problem: 'The required accuracy for conservation reads "within 0.01 % of the inflow". It does not say whether the difference is measured against the inflow so far or against the total in the chamber.'
  diagnosis: 'The two readings differ by a large factor early in the run: after the first step the inflow is a few millionths of the mass in the chamber.'
  fix: 'Took the stricter reading and wrote it down before the runs: the difference between the chamber''s total and (start + exact inflow), divided by the exact inflow up to that time, at every step. The report gives the other reading too.'
  lesson: 'A relative limit needs its reference quantity named. When it is not, the stricter reading is safe, and both numbers belong in the report.'
  guideline: 'When writing <code>required_accuracy</code>, name what each per cent is a per cent of ("of the inflow up to that time"). <code>cfdlib.contract --problem</code> could warn when an item gives a per cent with no "of".'
- id: 2
  stage: theory
  logged: 2026-11-15 09:52
  status: resolved
  problem: 'Request (d) asks how much the flow at two times differs when both are scaled by the time. On a grid of equal cells with a time step in fixed proportion to the cell size, that comparison is not independent of the grid study.'
  diagnosis: 'The method has no length scale either: after a given number of steps its answer depends only on the cell count from the corner. So the flow at half the time on a grid is, cell for cell, the flow at the full time on the grid with cells twice as large (as long as no far wall has been reached).'
  fix: 'Stated as a prediction in the theory section and tested by comparing the two runs directly (the part of the fine grid''s fifth snapshot round the corner against the whole coarse grid at the end). The similarity difference of request (d) is then reported as what it is: the change from one grid level to the next.'
  lesson: 'For a self-similar flow on a uniform grid, a similarity check at two times measures the grid error, not a separate property of the flow. It is still a useful test: it comes for free from one run, and it fails if a far boundary or a start-up error has put a length scale into the answer.'
  guideline: 'Add to the workflow, stage 1: "For a self-similar problem, ask whether the numerical method is self-similar too (equal cells, time step in proportion to the cell size). If so, an earlier snapshot of a fine run is a coarser run, and can serve as one level of the grid study at no cost."'
- id: 3
  stage: setup
  logged: 2026-11-15 09:56
  status: resolved
  problem: 'I patched run.py with a small Python script passed through a shell heredoc. The script held LaTeX backslashes and failed.'
  diagnosis: 'The machine file and the workflow both warn about this: a heredoc and a normal Python string each change a backslash sequence. The patch script''s own asserts stopped it before anything was written.'
  fix: 'Made the five changes with the file-editing tool.'
  lesson: 'The warning is right even for a three-line fix; a patch script that asserts each match once at least fails safely.'
