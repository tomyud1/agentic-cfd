# Numerical plan (made by the agent, not given by the user). Lengths in m.
solver: simpleFoam            # steady, incompressible, SIMPLEC; RANS with the Spalart-Allmaras model
mesh:
  # NASA's five nested grids, coarse to fine, written point for point (cfdlib.structgrid). Every level has
  # twice the cells of the one before in each direction, so the refinement ratio is exactly 2.
  levels: [G1, G2, G3, G4, G5]          # 35x25, 69x49, 137x97, 273x193, 545x385 points
  cores:  [1, 1, 1, 4, 8]               # MPI ranks per level (strips along x, so a wall-normal line stays in one rank)
  write_precision: 14                   # the finest wall cell is 5e-7 high in a domain of size 2.33
model:
  ft2: 'true'                 # standard SA has the f_t2 term; OpenFOAM v2606 leaves it out unless asked (insight 1)
  sigmaNut: 0.666666666666667 # NASA: sigma = 2/3; OpenFOAM's default is 0.66666
  Cs: 0.3                     # limiter S-tilde >= Cs Omega: OpenFOAM's default, and method (b) of Note 1 on NASA's page
schemes:
  div_U: 'bounded Gauss linearUpwind grad(U)'
  div_nuTilda: 'bounded Gauss linearUpwind grad(nuTilda)'   # second order; NASA's codes use first order here (variant below)
far_field:                    # the upper side: free-stream pressure, flow may leave or enter
  top_U: 'inletOutlet; inletValue uniform (50 0 0); value uniform (50 0 0);'
  top_p: 'fixedValue; value uniform 0;'
  top_nuTilda: 'inletOutlet; inletValue uniform 3e-05; value uniform 3e-05;'
  top_nut: 'calculated; value uniform 0;'
relaxation:
  consistent: 'yes'           # SIMPLEC: pressure not relaxed
  U: 0.9
  # Turbulence variable: 0.9 and 0.7 locked the iteration into a cycle of period 2 on G1 (insight 3: wall layer
  # flipping between two states, drag alternating by 15 %); 0.5 and 0.3 converge to residuals of 1e-12.
  # Trial on G1 (iterations until the drag is within 1e-5 of its final value): U 0.9 / nuTilda 0.5: 223;
  # 0.7 / 0.5: 301; 0.5 / 0.5: 526; 0.9 / 0.3: 607; 0.3 / 0.3: 1147.
  nuTilda: 0.5
  p: null
linear_solvers:
  p_solver: 'solver GAMG; smoother DICGaussSeidel;'
  p_tol: 1.0e-10
  p_relTol: 0.05
  p_maxIter: 200
  u_tol: 1.0e-12
  u_relTol: 0.01
convergence:
  max_iterations: 60000       # cap only; the live stop ends each run
  write_every: 5000
  # Live stop: estimated iteration error (cfdlib.monitor.steady_check) of every monitored value below its
  # tolerance, sampled every `every` iterations, held `hold` checks in a row. Monitored: the drag coefficient,
  # the velocity in the wall cell at the two stations (proportional to the local skin friction), and the
  # turbulence variable in the outer part of the boundary layer at the two stations.
  # Tolerances are relative to the current value. The skin friction is expected to change by about 2e-4 to
  # 5e-4 between the two finest grids (NASA's codes: 3e-4 to 4e-4), so 2e-6 is about 1 % of the smallest
  # grid change the study has to resolve.
  tol_rel: {cd: 2.0e-6, u_wall: 2.0e-6, nuTilda: 1.0e-5}
  # Sampled at an odd interval, and the change between consecutive iterations over the last 2 x every
  # iterations must be below the same tolerances: a period-2 cycle is invisible at an even interval (insight 3).
  every: 25
  hold: 2
probes:
  stations: [0.970084071, 1.90334]      # x of the wall-cell probes (nearest cell column downstream of each)
  outer_y: [0.006, 0.012]               # height of the outer-layer probe at each station (near the peak of nu_t)
preflight:
  iterations: 300             # short run on the finest grid
# ------------------------------------------------------------------------------------------------------------
# Acceptance rules, fixed 2026-11-13 BEFORE the production runs (after the pre-flight: G1 converged, G5 short run).
# "Reference" for the skin friction at the station is NASA's incompressible FUN3D series (like for like);
# everything else NASA publishes is for Mach 0.2 and is context, not a pass/fail reference by itself.
acceptance:
  # (a) grid-converged Cf at x1 (Richardson value of G3-G5) against the Richardson value of FUN3D incompressible.
  # PASS inside the combined band (my grid-convergence index + the reference's); WARN up to cf_fail; FAIL above.
  # cf_fail: half of the compressibility effect NASA measures on this quantity (0.87 %): a difference that
  # large could no longer be told apart from solving a different flow.
  cf_fail: 0.0045
  # the study itself must be sharp enough for the PASS to mean something: my grid-convergence index on G5
  cf_gci_max: 0.001
  # observed order of Cf at x1 on G3-G5 (the scheme is formally second order; NASA's codes show 1.3 to 2.0)
  order_range: [1.0, 3.0]
  # physical check per run: drag from the wall shear stress against the momentum the flow loses, measured
  # on the outer boundaries (inflow, outflow, top) with the solver's own face fluxes. The balance leaves out
  # the viscous normal stress on the inflow and outflow sides. Sized from the pre-flight: G1 converged closes
  # to 1.7e-5 (the left-out stress), the period-2 state of insight 3 was 8.5e-2 off and a weaker cycle 3e-3.
  momentum_balance: 1.0e-4
  # mass: sum of the boundary fluxes relative to the inflow (G1 converged: 1e-14)
  mass_balance: 1.0e-9
  # (d) inner layer on G5: u+ against the model's own law of the wall (theory.py: exact for the SA model
  # where the total shear stress is constant), for y+ <= 100 at both stations
  inner_law: 0.01
  # context checks against the compressible results (WARN only, never FAIL: not the same flow)
  cd_shift_tol: 0.003         # (b) C_D / C_D(CFL3D) minus the station's Cf ratio; NASA's two codes differ by 0.26 %
  cf_shape_tol: 0.003         # (c) spread of Cf(x) / Cf_CFL3D(x) over 0.1 <= x <= 1.9
  u_profile_tol: 0.005        # (d) largest |u - u_CFL3D| / U_inf at both stations
  nut_peak_tol: 0.02          # (e) peak nu_t/nu at x1, and the largest value along the plate over 0.2 <= x <= 1.9
# ------------------------------------------------------------------------------------------------------------
# One-change-at-a-time variants, to say what the remaining difference is made of. Each starts from the
# converged main solution of its grid.
sensitivity:
  noft2:    {levels: [G4], what: 'OpenFOAM default: without the f_t2 term (SA-noft2)', set: {ft2: 'false'}}
  upwind:   {levels: [G3, G4, G5], what: 'first-order upwind for the turbulence variable, as in NASA''s codes',
             set: {div_nuTilda: 'bounded Gauss upwind'}}
  limiter:  {levels: [G4], what: 'limiter on S-tilde at 0.1 Omega instead of 0.3 Omega', set: {Cs: 0.1}}
  speed:    {levels: [G4], what: 'inflow 0.3 % faster, skin friction still referred to the given speed', set: {U_inf: 50.15}}
  lid:      {levels: [G4], what: 'upper side closed by a frictionless lid instead of an open far field',
             set: {top_U: 'slip;', top_p: 'zeroGradient;', top_nuTilda: 'zeroGradient;', top_nut: 'calculated; value uniform 0;'}}
# ------------------------------------------------------------------------------------------------------------
# Pre-flight trials on G1, each stopped at a fixed iteration count through the stop file (run.py trials). The
# first is the period-2 cycle of insight 3; the others give the iterations to convergence per relaxation setting
# and the dependence of the converged drag on the velocity relaxation factor (insight 5).
trials:
  trial_base:     {U: 0.9, nuTilda: 0.9, iterations: 1500}
  trial_U09_nt05: {U: 0.9, nuTilda: 0.5, iterations: 3000}
  trial_U07_nt05: {U: 0.7, nuTilda: 0.5, iterations: 3000}
  trial_U05_nt05: {U: 0.5, nuTilda: 0.5, iterations: 3000}
  trial_U03_nt03: {U: 0.3, nuTilda: 0.3, iterations: 3000}
