profiles:
  _note: Finest grid (545 x 385), compressible. Read the files in reference/tmr/ with a Tecplot-zone reader.
  files:
    cf_plate.dat: Cf along the plate, CFL3D and FUN3D
    flatplate_u.dat: u / U_inf against y at x = 0.97008 and x = 1.90334 (CFL3D)
    flatplate_u+y+.dat: u+ against log10(y+) at the same two stations (CFL3D)
    u+y+theory.dat: law of the wall, kappa = 0.41, B = 5.0 (White, Viscous Fluid Flow, 1974, p. 472)
    mut_0.97.dat: eddy viscosity / freestream laminar viscosity against y at x = 0.97, CFL3D and FUN3D
    find_peak_mut.dat: largest eddy viscosity ratio against x (CFL3D)
notes:
- 'The page''s main results are compressible (M = 0.2): ''if you run this case with an incompressible code, your
  results may be close - but not quite the same - as the grid is refined''.'
- 'Drag: ''formal order-property convergence may not be generally achievable'', because the skin friction is singular
  at the leading edge; the two codes also differ locally at the leading and the trailing edge of the plate.'
- 'OpenFOAM: ''As of 2014, the implementation of SA, SST, and Wilcox2006 in the standard version of OpenFOAM did
  not match the equations given on this website'' (openfoam_issues.html; the page does not track later versions).'
- Results of SA without the ft2 term (SA-noft2) are 'essentially identical' to SA for this case.
- The files give more digits than the codes' convergence supports (SA page).
