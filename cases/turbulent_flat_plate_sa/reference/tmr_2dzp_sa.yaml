# Reference data of NASA TMR case VERIF/2DZP with the Spalart-Allmaras model, parsed by code
# (setup/parse_tmr_flatplate.py) from the files in reference/tmr/ and reference/grids/. Do not edit by hand.
source: 'NASA Langley Turbulence Modeling Resource (run by the AIAA Turbulence Model Benchmarking Working Group),
  case VERIF/2DZP ''2D Zero Pressure Gradient Flat Plate Verification Case'', pages https://tmbwg.github.io/turbmodels/flatplate.html,
  https://tmbwg.github.io/turbmodels/flatplate_sa.html, https://tmbwg.github.io/turbmodels/flatplate_grids.html,
  retrieved 2026-11-13. Model: Spalart, Allmaras, ''A One-Equation Turbulence Model for Aerodynamic Flows'', Recherche
  Aerospatiale 1, 1994, 5-21, in the form on https://tmbwg.github.io/turbmodels/spalart.html. The data is ''provided
  as-is''.'
saved_files: reference/tmr/ holds the pages and data files exactly as downloaded (setup/fetch_tmr_flatplate.sh).
conditions:
  mach: 0.2
  reynolds_per_unit_length: 5000000.0
  reference_length: 1.0
  plate:
  - 0.0
  - 2.0
  reference_area_for_drag: 2.0
  reference_temperature_rankine: 540.0
  domain:
    x:
    - -0.33333
    - 2.0
    y:
    - 0.0
    - 1.0
  boundaries_from_figure:
    _note: read from the figure plateBCpic.jpg by a person, not parsed (the page gives the boundary conditions only
      there)
    inflow: total pressure Pt/Pref = 1.02828, total temperature Tt/Tref = 1.008, 1 quantity from interior
    top: farfield Riemann BC
    outflow: P/Pref = 1.0, other quantities from interior
    bottom_ahead_of_plate: symmetry (from the inflow to x = 0)
    plate: adiabatic solid wall
  sa_inflow: 'nu_tilde = 3 nu_infinity (page: ''nu_tilde_farfield >= 3 nu_inf''; CFL3D input: tur10 3.0)'
  intro_note: The page says variations of the inflow, top and outflow conditions may also work and give similar
    results; moving the top from y = L to y = 0.48 L changed drag and Cf at x = 0.97 by less than 0.2 %.
reference_codes: CFL3D (cell-centred, structured) and FUN3D (node-centred, unstructured, same hexahedral grids).
  Both compressible, Roe flux-difference splitting with UMUSCL, full Navier-Stokes, first-order upwind for the advective
  terms of the turbulence model. Not converged to machine zero (CFL3D density residual below 1e-13).
station_x: 0.970084071
station_note: 'The station is a grid point of all five grids, so a cell-centred code has no wall face centred on
  it: the two nearest wall-face centres are listed per grid. The page does not say how CFL3D evaluated Cf there.'
definitions:
  cf: wall shear stress / (0.5 rho_inf U_inf^2) at the station
  cd: drag of the plate / (0.5 rho_inf U_inf^2 times the reference area 2), friction only
