source: 'Chapman-Jouguet theory: the slowest wave whose burnt gas, in chemical equilibrium, satisfies the conservation of
  mass, momentum and energy across the wave. Computed by cfdlib.chem.cj_detonation from the thermodynamic data of OpenFOAM''s
  hydrogen scheme ($FOAM_TUTORIALS/combustion/chemFoam/h2/chemkin/therm.dat). It does not depend on the reaction rates.'
