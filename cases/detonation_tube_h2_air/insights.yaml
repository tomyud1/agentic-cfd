- id: 16
  stage: analysis
  logged: 2026-11-16 09:45
  status: resolved
  problem: The first run of the analysis stopped while it formatted the given data. The pressure of the ignition layer came out
    of <code>problem.yaml</code> as text, not as a number.
  diagnosis: 'The file writes the value as <code>3.0e6</code>. The YAML reader of Python takes a number in this notation only
    when the exponent has a sign (<code>3.0e+6</code>); without it the value is a string. The other values of the file have a
    signed exponent or none.'
  fix: The analysis converts every given value to a number, as the theory module already did.
  lesson: A value that looks like a number in a YAML file may not be one.
  guideline: <code>contract.check_problem_file</code> could refuse a given value that is a string, or convert it; the problem
    template could say to write exponents with a sign.
- id: 17
  stage: analysis
  logged: 2026-11-16 09:44
  status: resolved
  problem: 'I wrote in a figure caption, in a decision and in the theory text that the strong ignition layer drives the wave too
    fast at first. The first figure drawn from the runs showed the opposite: the wave starts several percent slower than the CJ
    speed and rises to it.'
  diagnosis: 'I had reasoned from the pressure of the layer (30 atmospheres against 16 behind a CJ wave) and written the text
    before any full run existed. The layer is thin (\(1.5\,\mathrm{mm}\)), so its push fades within a few millimetres, and the
    wave then needs time to build up.'
  fix: The three texts were corrected, and the caption now takes the early speed and the settling time from the data.
  lesson: Text about a result is written from the result. A sentence written before the runs is a prediction and belongs
    with the rules, where it would have been checked.
  guideline: None needed; the workflow already says that numbers and claims in the report come from code.
- id: 18
  stage: analysis
  logged: 2026-11-16 09:47
  status: resolved
  problem: 'The problem asks for the pressure and temperature of the burnt gas "just behind the wave". In a closed tube there
    is no such stretch of constant state: the pressure falls from the peak at the front straight into the expansion wave.'
  diagnosis: 'The CJ state is one point of the profile, the point between the burning zone and the expansion. Reading the
    state at a fixed distance gives any value from 1.2 to 0.9 of the CJ pressure, depending on the distance.'
  fix: 'The burnt state is read at the first point behind the front where the gas moves away from it at its own speed of
    sound (\(u + c = D\), with the speed of sound at fixed composition): the definition of the end of the wave proper. A table
    gives the state at five fixed distances next to the two pictures of theory.'
  lesson: An output of a problem needs a reading rule that names a point, not a region.
  guideline: 'The problem statement of the next detonation case could name the point (where \(u + c = D\)), and the reference
    file could give the equilibrium and the fixed-composition speed of sound at the CJ state, since the two differ by a
    few percent and the choice moves the point.'
- id: 19
  stage: production
  logged: 2026-11-16 10:02
  status: resolved
  problem: 'The run with the implicit chemistry solver <code>seulex</code> took \(513\,\mathrm{s}\), seven times the \(73\,\mathrm{s}\)
    of the main settings on the same grid. My short timing tests had put the two within a tenth of each other.'
  diagnosis: 'The short tests covered the first fifth of the time, when few cells are burnt and the fixed cost of a parallel step
    hides the chemistry. Over the full run the burnt cells dominate, and there <code>seulex</code> pays for a Jacobian and its
    factorisation in every cell and pass, for steps of some tens of nanoseconds that the explicit method covers in a few sub-steps.
    The wave speed is the same to four digits.'
  fix: None needed for the answer; the forecast was simply wrong, and this one run took a quarter of the production time.
  lesson: The same lesson as insight 11, a second time. A timing over the first part of a run with a growing burnt region says
    little about the whole run, also for the comparison of two methods.
  guideline: 'The primer''s chemistry section could say: in a detonation run with flow steps of tens of nanoseconds, an explicit
    chemistry solver with error control (<code>RKF45</code>) is several times cheaper than <code>seulex</code> at the same answer.'
- id: 20
  stage: analysis
  logged: 2026-11-16 10:06
  status: resolved
  problem: 'The wave speed does not converge with the cell size. From 800 to 3200 cells it moves away from the CJ speed by a
    tenth of a percent with each halving (\(-0.32\,\%\), \(-0.41\,\%\), \(-0.51\,\%\)), and the time-step study shows no trend
    either.'
  diagnosis: 'The wave has not finished settling when the time ends. Split into three stretches of the time, the front speed on
    the finest grid is \(-0.57\,\%\), \(-0.54\,\%\) and \(-0.49\,\%\) from the CJ speed, and on the coarsest \(-1.04\,\%\),
    \(-0.64\,\%\) and \(-0.34\,\%\): every grid closes in on the CJ speed from below, the coarse ones faster. So the speed over
    the second half measures how far the settling has got, and that differs from grid to grid. Why finer grids settle more
    slowly was not found out.'
  fix: The report gives the three stretches for every grid, claims no order and extrapolates nothing.
  lesson: Before reading a grid study of a quantity taken over a time window, check that the quantity is steady in that window
    on every grid. A study of something that is still changing compares stages, not errors.
  guideline: 'For the next detonation case: a longer tube, or a wave speed read over the last fifth of the time, with the
    speed over two successive windows as a settling check. The problem statement could ask for that check.'
