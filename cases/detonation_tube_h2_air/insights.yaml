  stage: preflight
  logged: 2026-11-16 09:29
  status: open
  problem: 'The answer depends a little on how the tube is cut between the ranks. On a short run of 1200 cells the front after
    \(10\) microseconds stood at \(20.472\,\mathrm{mm}\) on one core and between \(20.474\) and \(20.491\,\mathrm{mm}\) for four
