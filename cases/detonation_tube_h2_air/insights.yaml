# Workflow insights, logged LIVE (cfdlib/insights.py). One entry per problem, surprise or retry:
#   id, stage, logged (real time first met), status (open | resolved), problem,
#   then when solved: diagnosis, fix, lesson, guideline (the change to the workflow that would have prevented it).
# stage: intake | theory | setup | preflight | production | analysis | report | tooling | performance

- id: 1
  stage: setup
  logged: 2026-11-16 08:44
  status: resolved
  problem: The first trial stopped at once. OpenFOAM could not read the start value of the hydrogen mass fraction, because the
    case file held the text <code>np.float64(0.0285...)</code> where a number belongs.
  diagnosis: The mass fractions came from a NumPy array, and <code>repr()</code> of a NumPy number prints its type. <code>foam.render_case</code>
    writes whatever text it is given.
  fix: Converted every value to a Python float before it goes into the case parameters.
  lesson: A value that goes into a case file must be a plain number. The mistake is silent in Python and stops the solver.
  guideline: <code>foam.render_case</code> could convert NumPy numbers to plain ones, or refuse a rendered file that contains
    <code>np.float64(</code>.
- id: 2
  stage: setup
  logged: 2026-11-16 08:46
  status: resolved
  problem: The chemistry takes about 97 % of the run time of <code>reactingFoam</code> on this problem, and it costs the same in
    every cell, also in the cold gas that the wave has not reached. Every chemistry method costs about the same.
  diagnosis: 'OpenFOAM integrates the chemistry of every cell in every time step, at least one step of the method per cell: about
    \(21\) to \(33\) microseconds per cell, whatever the cell holds. The flow part of a step costs under \(1\) microsecond per cell.
    Five methods and tolerances were timed on the same short run: the explicit method <code>RKF45</code> was cheapest (\(25\,\mathrm{s}\)),
    <code>seulex</code> dearest (\(40\,\mathrm{s}\)), and all put the front within \(0.02\,\mathrm{mm}\) of each other after \(19\,\mathrm{mm}\)
    of travel.'
  fix: Chose <code>RKF45</code>, and set the entry <code>Treact</code> of the chemistry dictionary just above the start temperature,
    so that cells the wave has not reached are skipped. The same-answer check of that setting is a run of the plan.
  lesson: In a flow solver the chemistry is not dear where it is fast; it is dear everywhere, because of the fixed cost per cell
    and step. With time steps of a few nanoseconds no cell is stiff, so an explicit method is enough.
  guideline: 'The primer''s chemistry section could say: in <code>reactingFoam</code> budget about \(20\) to \(30\) microseconds per
    cell and step for the hydrogen scheme on one core, in every cell; <code>Treact</code> skips cold cells; the chemistry is solved
    again in every outer corrector.'
- id: 3
  stage: setup
  logged: 2026-11-16 08:49
  status: resolved
  problem: With the settings of OpenFOAM's reacting examples (one pass per time step, called PISO mode) the wave ran at about
    \(1790\,\mathrm{m/s}\) on the first grid, 9 % below the Chapman-Jouguet speed, and a finer grid at the same Courant number was
    no better.
  diagnosis: 'The solver was losing energy. The total energy in the closed tube (heat content, chemical energy and kinetic energy
    minus pressure times volume, summed from the solver''s own fields after every step) fell by about 10 % of the heat the burning
    had released. Halving the time step halved the loss (5 %); halving the cell size at the same Courant number did not reduce
    it (12 %). The cause is the order of the solver''s steps: the energy equation is solved before the pressure, with the pressure
    change of the pass before. Repeating the pass (<code>nOuterCorrectors</code>) removes it: the loss is 0.8 % with 3 passes and
    0.13 % with 5.'
  fix: Five passes per time step, and the energy balance of every run as the physical check of the plan, with a limit set before
    the runs.
  lesson: 'A pressure-based solver does not conserve energy by construction. On a detonation the missing energy is missing heat
    release, and the wave is slower: in the full runs on 800 cells it is 17 % below the CJ speed with one pass (15 % of the heat
    lost), 0.6 % below with three passes (1.6 % lost) and 0.3 % below with five (0.2 % lost). It does not show in residuals, in the mass or in the look of the profiles, and
    grid refinement does not remove it.'
  guideline: 'The primer needs an entry for pressure-based compressible solvers with shocks or burning (<code>reactingFoam</code>,
    <code>rhoPimpleFoam</code>): PISO mode loses energy in proportion to the time step; use 3 to 5 outer correctors and check the
    energy balance. A helper in <code>cfdlib</code> that turns the volume integrals of a reacting run into total energy and atoms
    would make this check one call (this case''s <code>measure.py</code> has it).'
- id: 4
  stage: setup
  logged: 2026-11-16 08:53
  status: open
  problem: 'An even number of passes per time step (2 or 8) adds energy in the first microsecond: \(1750\) to \(2750\,\mathrm{J/m^2}\),
    which is 12 to 19 % of what the ignition layer holds above the gas around it. An odd number (3, 5) does not (under \(40\,\mathrm{J/m^2}\)).'
  diagnosis: Not explained. The passes of a step are not relaxed, so successive passes may overshoot in turn at the sharp jump
    of the start, and the last pass then decides the sign of the error. Later, while the wave travels, 2 passes lose 2.1 % of
    the heat released and 8 passes gain 0.13 %, in line with the odd counts.
  fix: Odd counts only (5 in the main settings); the start-up error of each run is reported.
- id: 5
  stage: setup
  logged: 2026-11-16 08:50
  status: resolved
  problem: The solver stopped when the energy variable was changed from enthalpy to internal energy (<code>sensibleInternalEnergy</code>),
    with "Unknown chemistryReader type chemkinReader".
  diagnosis: OpenFOAM v2606 builds its reader of CHEMKIN files for the enthalpy form only. With internal energy the scheme must
    first be converted by <code>chemkinToFoam</code>.
  fix: Stayed with enthalpy, the form of OpenFOAM's reacting examples. The internal-energy form was not tested.
  lesson: The problem asks for the scheme's files as they are; the direct reader does that only with the enthalpy form.
  guideline: A line in the primer's chemistry section.
- id: 6
  stage: setup
  logged: 2026-11-16 08:54
  status: resolved
  problem: Skipping the chemistry below \(500\,\mathrm{K}\) (<code>Treact</code>) changed the answer a little, where I expected no change
    at all. After \(10\) microseconds the front was \(0.018\,\mathrm{mm}\) behind (0.09 %).
  diagnosis: On these grids the pressure front is two or three cells wide and the burning starts inside it. Cells in the foot of
    the front are colder than \(500\,\mathrm{K}\) and already hold reactive species that the scheme has smeared forward. They react
    there, and the cut-off stops that.
  fix: The cut-off is set at \(305\,\mathrm{K}\), just above the start temperature, so that only cells the wave has not touched are
    skipped. A run without the cut-off checks it.
  lesson: A setting that should only save time can change the answer where the front is under-resolved. Measure it with a same-answer
    pair.
  guideline: None needed beyond the workflow's rule that a speed setting needs a check of the answer.
- id: 7
  stage: preflight
  logged: 2026-11-16 09:06
  status: resolved
  problem: The first pre-flight failed its start-state check. After the first time step the tube held 0.17 % more mass than at
    the start, the atoms had changed by 0.2 %, and the highest pressure was 3.34 instead of 3.00 megapascals. After that step
    the mass no longer changed.
  diagnosis: 'Two causes, found one after the other. (1) My plan had a grid of 600 cells, on which the \(1.5\,\mathrm{mm}\) ignition
    layer is 7.5 cells; <code>setFields</code> took 8, so the layer was \(1.6\,\mathrm{mm}\) thick and held 0.21 % more mass.
    (2) The solver''s first time step does not keep mass when the gas reacts in it: 0.04 % was lost in a first step of 40 nanoseconds.
    My reading is that on its first step the solver has no stored gas state of the step before, so the pressure equation uses
    the state after the first chemistry step in its place; this reading was not checked in the source beyond the order of the calls.'
  fix: 'Grids with a multiple of 80 cells only (400 and 800 replace 600), and a guard in <code>run.py</code> that refuses any
    other. The first time step is now \(10^{-12}\,\mathrm{s}\) and grows by a fifth per step to the step of the run. The start
    then agrees with the values computed without the solver: mass to \(5 \times 10^{-9}\), energy and highest pressure exactly.'
  lesson: A start-state check against numbers computed without the solver caught both. Without it the 600-cell run would have
    looked healthy, with a slightly stronger ignition.
  guideline: 'The primer could say for <code>reactingFoam</code> and its relatives: a first time step in which the gas reacts or
    heats is not mass-conserving; start with a tiny step. And for any layer or jump set by <code>setFields</code>: check that
    its edge is a cell face on every grid of the family.'
- id: 9
  stage: tooling
  logged: 2026-11-16 09:12
  status: resolved
  problem: With the growing first step, <code>monitor.assess</code> marked a healthy short run as failed ("Courant number trend",
    a factor of \(7 \times 10^{5}\), and "Continuity-error trend").
  diagnosis: The run starts from rest with a step of \(10^{-12}\,\mathrm{s}\), so over the first 50 steps both the step and the
    gas speed grow. The check has an exemption for a growing step, but it tests whether the speed stayed the same, and from rest
    it does not.
  fix: The case's health check gives <code>monitor.assess_arrays</code> the log from the first step of the planned size on.
  lesson: A deliberate ramp from rest looks like a blow-up to a trend check.
  guideline: <code>monitor.assess</code> could take a start time (or skip the steps before the time step first reaches its cap).
- id: 10
  stage: preflight
  logged: 2026-11-16 09:15
  status: resolved
  problem: With an adjustable step OpenFOAM does not shorten the steps to land on a sampling time, it lengthens the last two.
    On 400 cells with 833 steps (8.33 steps between two samples) two steps in every eight were 17 % longer than the step I had set
    as the largest.
  diagnosis: The solver rounds the number of steps to the next sampling time down, then spreads the remainder over the last
    steps; <code>maxDeltaT</code> does not bound that.
  fix: Step counts that are a multiple of the number of samples (100), so that a whole number of steps fits between samples.
    The pre-flight checks that no step is more than 2 % longer than planned.
  lesson: The largest step of a run is not what the dictionary says; read it from the output.
  guideline: A line in the primer's list of function-object pitfalls.
- id: 11
  stage: preflight
  logged: 2026-11-16 09:28
  status: resolved
  problem: 'My run plan did not fit the time. It went up to 9600 cells, with the studies on 1200 cells. The one-core timing
    run of the pre-flight on 1200 cells was a third done after 100 seconds and getting slower, and the short test of the 9600-cell
    grid took 92 milliseconds per time step on 16 ranks before much gas had burnt: 30 minutes for that run from this cost alone.'
  diagnosis: 'Three costs, measured on short runs of 1200 cells. (1) The chemistry of a burnt cell costs about \(100\) to \(140\)
    microseconds per pass at the time step of the plan, five times the figure of my first trials (insight 2), which were made at
    half the time step and mostly on unburnt cells: the explicit method takes sub-steps in proportion to the flow step, and the
    implicit methods were no cheaper (<code>seulex</code> \(21.5\,\mathrm{s}\), <code>Rosenbrock34</code> \(19.1\,\mathrm{s}\),
    <code>RKF45</code> \(19.4\,\mathrm{s}\)). With five passes the chemistry is solved five times per step. (2) A parallel run
    pays about \(25\) milliseconds per time step whatever the grid (the same on 400 and on 1200 cells), so 8 ranks were only
    twice as fast as one core. (3) Balance: with one piece of tube per rank, 8 ranks were no faster than one, because all the
    burnt gas is in the first ranks; 3 stretches per rank gave 1.3 times, 12 stretches 2 times.'
  fix: 'The plan was cut before any full run was kept: four grids of ratio 2 up to 3200 cells (\(37.5\) micrometres) in place of
    six up to 9600, the studies on 800 cells, the one-core run only over the first fifth of the time, 8 ranks everywhere. The
    cut is written in <code>numerics.yaml</code> and in the mesh decision.'
  lesson: 'Size the plan from a timing at the plan''s own settings (time step, passes, tolerance) and on burnt gas, not from
    the first trial. For a wave that leaves burnt gas behind, the cost of a run grows with the square of the time covered, so
    the first few percent say little.'
  guideline: 'The pre-flight could give a cost forecast for runs whose cost per step grows (a quadratic fit of the run time
    against the simulated time of the short run), next to its present straight-line one. The primer could say that MPI in WSL
    on this PC costs about 25 ms per time step of <code>reactingFoam</code> with 5 passes on 8 ranks, so small grids gain little.'
