- id: 13
  stage: preflight
  logged: 2026-11-16 09:40
  status: resolved
  problem: 'My rule for the burnt state found nothing on any run of the pre-flight. The rule looks for the first point behind the
    front where the gas moves away from the front at its own speed of sound.'
  diagnosis: 'The search started at the pressure front and took the first cell behind it that met the condition. Those are the
    cells inside the front itself, where the gas is still cold and slow; they meet the condition too. The point that is meant
    lies behind the hot stretch in which the gas is slower than its sound relative to the front.'
  fix: 'The search now starts from the front end of that hot stretch. On 800 cells the point is \(4.8\,\mathrm{mm}\) behind the
    front. The finished runs were read again with the corrected rule; no run was repeated.'
  lesson: A reading rule written before any run needs one look at a real profile before the runs that depend on it. The pre-flight's
    full run gave that look in time.
  guideline: None beyond the workflow's rule that the pre-flight exercises every reading rule on real output.
- id: 14
  stage: tooling
  logged: 2026-11-16 09:33
  status: resolved
  problem: 'A pre-flight that I started in the background inside WSL (with nohup, from a wsl command that then returned) never
    ran. Half a minute later WSL reported an up-time of zero minutes.'
  diagnosis: 'When the last wsl command returns, Windows shuts the WSL virtual machine down after a few seconds, and every process
    in it dies, nohup or not. The machine file says that /tmp is wiped when the machine idles, which is the same event, but
    not that background jobs die with it.'
  fix: The long runs are started as a wsl command that stays in the foreground of a background task of the agent's tool.
  lesson: On this PC a job lives only as long as a wsl command is attached to it.
  guideline: 'A line in <code>workflow/machines/dev-pc.md</code>: a job detached inside WSL dies when the calling wsl command
    returns; keep the wsl command itself running (in a background task) for as long as the job.'
