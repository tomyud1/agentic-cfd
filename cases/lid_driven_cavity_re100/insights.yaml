  lesson: 'Cross-references are numbers too: compute them.'
  guideline: 'cfdlib.report: support a placeholder such as <code>{fig:u_profile}</code> in any text field, replaced
    by the figure number at render time (and have the contract fail on unknown keys).'
- id: 13
  stage: tooling
  logged: 2026-11-10 (time not recorded)
  status: resolved
  problem: The built-in browser cannot open local <code>file://</code> pages, so the rendered report could not be
