- id: 15
  stage: report
  logged: 2026-11-10 (time not recorded)
  status: resolved
  problem: Unclear how strictly "every number is computed by code" applies to free text that the agent writes in
    decisions.yaml and insights.yaml (e.g. "9481 iterations, about 10 min" in an insight, residual targets in a
    decision), and to hand-written cross-references and captions. A caption saying "the gap shrinks with each refinement"
    was also written before the final data and turned out FALSE.
  diagnosis: The contract checks structure, not provenance. Prose written early (decisions, captions) can go stale
    or contradict the data.
  fix: Captions and findings in analyze.py were rewritten so every quantitative statement is computed (figure numbers,
    contour spacing, tolerances, "settles rather than shrinks" with the measured numbers). Insights keep a few hand-written
    numbers as a historical log; decisions quote the settings themselves.
  lesson: Qualitative claims in captions ("shrinks", "agrees") are results too; compute them or condition them on
    the data.
  guideline: 'report-contract.md: state that decisions/insights are the only free-text fields allowed to contain
    typed numbers (as a log of settings and events), and that captions/findings must be generated from data; consider
    a contract warning when a caption contains digits not produced by tex_num.'
