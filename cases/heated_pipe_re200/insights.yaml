- id: 15
  stage: production
  logged: 2026-11-13 10:02
  status: resolved
  problem: 'The live stop held the finest run (L4) for about 1100 iterations (about 9 minutes) after the answer
    had converged far below the tolerance: at iteration 2190 the slowest axial-velocity probe changed by \(7 \times
    10^{-11}\,\mathrm{m/s}\) per 10 iterations, shrinking steadily (ratio about 0.92), i.e. a remaining error near
    \(10^{-9}\), against a tolerance of \(10^{-7}\); the verdict stayed ''running'' until the changes reached the
    output-precision rule at iteration 3289.'
  diagnosis: <code>iteration_error</code> needs the last change ratios to agree within a factor (\(1 - \min\) ratio
    \(< 1.5\,(1 - \rho)\)); with changes of a few hundred units of the 12th digit, rounding makes the ratios scatter
    enough to fail that test, so the estimate stays infinite although every bound on the remaining change is two
    orders below the tolerance.
  fix: None during the run (the answer was not affected, only the time). The 'output precision' work-around of insight
    9 eventually ended it.
  lesson: 'A stop rule should also accept a simple, conservative bound when the changes are orders of magnitude
    below the tolerance (for example: the sum of the last N changes times a safety factor), not only a fitted geometric
    rate.'
  guideline: 'cfdlib.monitor.steady_check: add a ''far below tolerance'' branch: if the largest of the last k changes,
    times k and a safety factor, is below tol/10, report settled; test it on case 6''s L4 probe history (results/heated_pipe_re200/runs/L4.npz,
    probe_Ux).'
