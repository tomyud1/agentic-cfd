# Workflow insights, logged LIVE (cfdlib/insights.py). One entry per problem, surprise or retry:
#   id, stage, logged (real time first met), status (open | resolved), problem,
#   then when solved: diagnosis, fix, lesson, guideline (the change to the workflow that would have prevented it).
# stage: intake | theory | setup | preflight | production | analysis | report | tooling | performance

- id: 1
  stage: theory
  logged: 2026-11-13 08:43
  status: resolved
  problem: 'The tube is not long enough to reach the fully developed state that output (b) asks for: the exact series
    gives \(Nu(L_h) = 4.3867\) at the outlet (\(x = 120\,D\), \(x^+ = 0.086\)), still \(0.53\,\%\) above \(Nu_{fd}
    = 48/11 = 4.3636\). Reading the simulated \(Nu\) at the outlet as \(Nu_{fd}\) would build a \(0.5\,\%\) bias
    into the comparison, comparable to the expected mesh error.'
  diagnosis: The first eigenmode decays like \(e^{-\lambda_1^2 X/2}\) with \(\lambda_1 = 5.07\); at \(x^+ = 0.086\)
    its weight is still \(5 \times 10^{-3}\). The 5 % entrance length is \(60\,D\), but 0.1 % needs about \(165\,D\).
  fix: 'Compare like with like: simulated \(Nu(L_h)\) against the exact \(Nu(L_h)\), and estimate the simulation''s
    own \(Nu_{fd}\) by fitting \(T_w - T_b = A + B e^{-c x}\) to its tail (no theory input), then compare \(A\)
    with \(48/11\).'
  lesson: A requested 'fully developed' value must be checked against how developed the domain end actually is;
    compute that from theory at intake.
  guideline: 'SKILL.md stage 1: when a requested output is a limit (fully developed, far field, long time), compute
    how close the domain gets to that limit and compare the simulation at the same position, or extrapolate both
    sides the same way.'
  resolved: 2026-11-13 08:49
- id: 2
  stage: theory
  logged: 2026-11-13 08:43
  status: resolved
  problem: 'Series truncation self-check failed at first: 40 and 80 eigenfunctions differed by \(6.9 \times 10^{-4}\)
    in \(Nu\) at \(x = 0.1\,D\) (the flux jump makes \(Nu \to \infty\) at the start of heating, so the series converges
    slowly there).'
  diagnosis: Terms decay like \(e^{-\lambda_n^2 X/2}\) with \(\lambda_n \approx 4n\); at \(X = 2.9 \times 10^{-4}\)
    term 40 is still \(e^{-3.7}\).
  fix: Use the series from \(x = 0.5\,D\) on (60 and 80 terms then agree to round-off) and check it there against
    an independent finite-volume solution (agreement \(4 \times 10^{-6}\)). The comparison with the simulation starts
    at \(0.5\,D\).
  lesson: Eigenfunction series of entrance problems need a stated lower bound in x where they are converged; an
    independent numerical solution of the same 1D equation is a cheap, strong self-check.
  guideline: 'Worked-example note: for series solutions, check truncation at the smallest position used, and add
    an independent method-of-lines solution as a self-check.'
- id: 3
  stage: preflight
  logged: 2026-11-13 08:49
  status: resolved
  problem: 'Pre-flight FAILED on both L1 (800 cells) and L4 (51200 cells): floating-point exception within 30 iterations.
    Continuity error grew from \(2 \times 10^{-3}\) to \(98\) in 7 iterations; outlet flux 1500 times the inlet
    flux at iteration 10. Settings: SIMPLEC (consistent yes), U relaxation 0.95, p_rgh not relaxed, uniform initial
    velocity, cells with aspect ratio up to 281.'
  diagnosis: '<code>buoyantBoussinesqSimpleFoam</code> does not implement SIMPLEC: its <code>pEqn.H</code> never
    reads <code>simple.consistent()</code> (simpleFoam''s does). So <code>consistent yes</code> was silently ignored
    and the run was plain SIMPLE with U relaxation 0.95 and NO pressure relaxation, which is unstable. A side-by-side
    test on L1 confirmed it: SIMPLEC-style settings U 0.9 / p 1 diverged in 24 iterations, U 0.9 / p 0.7 ran but
    with continuity error \(3 \times 10^{20}\), while plain SIMPLE U 0.7 / p 0.3 converged.'
  fix: Plain SIMPLE (<code>consistent no</code>) with the pressure relaxed, \(\alpha_p \approx 1 - \alpha_U\). Settings
    ranked by a short trial on L1 to L3 (iterations to the live-stop rule).
  lesson: A solver can silently ignore a keyword that another solver of the same family honours. The primer's SIMPLEC
    advice (U 0.97 to 0.99, p not relaxed) applies to simpleFoam only.
  guideline: 'openfoam-primer.md, pitfall list: buoyantBoussinesqSimpleFoam (and check other heat-transfer solvers)
    has no SIMPLEC; use SIMPLE with p relaxed. Better: a tooling check that greps the solver''s source for <code>consistent</code>
    and warns when the case sets it but the solver ignores it.'
  resolved: 2026-11-13 08:52
- id: 4
  stage: performance
  logged: 2026-11-13 09:02
  status: resolved
  problem: 'GAMG for the pressure needed 46 to 88 iterations per solve on L3 (12800 cells), 0.16 s per SIMPLE iteration:
    about 12 microseconds per cell per iteration, several times the usual. The temperature solve (PBiCGStab) also
    needed 66 to 83 iterations.'
  diagnosis: 'The graded tube mesh has cells up to 300 times longer (axially) than wide (radially at the wall),
    so the pressure matrix couples cells \(10^4\) to \(10^5\) times more strongly across the tube than along it.
    GAMG''s agglomeration and smoothers are not tuned for that. A 4-way side-by-side trial (150 iterations from
    rest, L3): GAMG 0.156 s/it, PCG/DIC 0.108 s/it (308 iterations per solve but each far cheaper), PCG with a GAMG
    preconditioner 0.166, GAMG with 10 coarsest cells 0.333.'
  fix: 'First switched to PCG/DIC on the strength of the L3 trial; the L4 pre-flight (300 iterations each, run one
    after the other) reversed the ranking: PCG 0.74 s per iteration with 619 iterations per solve, GAMG 0.62 s with
    29. PCG''s iteration count grows about 2 times per refinement, GAMG''s does not. Production uses GAMG. (A first
    reading of 0.25 s per iteration for GAMG was wrong: my wait loop matched the banner line ''Floating point exception
    trapping enabled'', primer pitfall 9, and read the time mid-run.)'
  lesson: 'A solver trial on a coarser mesh can rank the solvers wrongly: Krylov iteration counts grow with the
    mesh, multigrid counts do not. Trials that ran 4 at a time on L3 also added noise. Rank solvers on the mesh
    that dominates the cost.'
  guideline: 'SKILL.md side mission and the primer: run linear-solver trials on the finest (most expensive) mesh,
    alone on the machine, before choosing; a trial on a coarser mesh can reverse the ranking (case 6: PCG 1.4 times
    faster on L3, 3 times slower on L4).'
  resolved: 2026-11-13 09:07
- id: 5
  stage: analysis
  logged: 2026-11-13 09:14
  status: resolved
  problem: 'On the converged L1 run the last two cells of the heated section were off: the last cell''s bulk temperature
    was \(+3.9\,\%\) of \(\Delta T_{fd}\) above the exact value at its centre and the one before \(-0.9\,\%\) below,
    while everywhere else the error was below \(0.05\,\%\). A wall temperature extrapolated from the last two wall
    faces to the outlet was \(0.019\,\mathrm{K}\) (6 % of \(\Delta T_{fd}\)) too high.'
  diagnosis: The zero-gradient outlet condition makes the face value equal the last cell's value, and energy conservation
    then forces the last cell to carry the OUTLET bulk temperature (20.460008 °C = outlet patch value), i.e. the
    value half a cell further downstream; linear upwind compensates in the cell before. A first-order outlet artifact
    over the last two cells (\(12\,D\) on L1), shrinking with the cell size. Also, OpenFOAM does not write face
    values for <code>fixedGradient</code>/<code>zeroGradient</code> patches, so the wall temperature had to be rebuilt
    as \(T_P + (\partial T/\partial n)\,d\) from the owner cells (first attempt crashed reading a missing <code>value</code>).
  fix: 'Compare along the tube only up to \(x = 100\,D\) (a fixed window, same on every mesh). Outlet values from
    the simulation without the last cells: \(T_b(L_h)\) from the outlet patch flux (exact energy flux), \(T_w(L_h)
    - T_b(L_h)\) and \(Nu(L_h)\) from the tail fit \(A + B e^{-cx}\) over \(60\) to \(100\,D\). On L1 this gives
    \(T_w(L_h)\) within \(0.0004\,\mathrm{K}\).'
  lesson: Values in the last cells before a zero-gradient outlet are outlet values, not cell-centre values, for
    any convected quantity that keeps changing along the flow. Requested 'outlet' values need either a long outlet
    extension or extrapolation from the interior.
  guideline: 'openfoam-primer.md pitfalls: a zero-gradient outlet shifts the last one or two cells of a quantity
    that still varies in x (heated pipes, developing flows); exclude them from comparisons or add an unheated outlet
    extension. And: fixedGradient/zeroGradient patches write no face values; rebuild them from the owner cells or
    use a <code>surfaceFieldValue</code> with <code>writeFields</code>.'
  resolved: 2026-11-13 09:23
- id: 6
  stage: setup
  logged: 2026-11-13 09:14
  status: resolved
  problem: 'The \(2^\circ\) wedge planned at first has a flat wall face: its perimeter-to-area ratio differs from
    the round tube''s by \(1/\cos 1^\circ - 1 = 1.5 \times 10^{-4}\). The L1 run showed it directly (outlet bulk
    \(+7 \times 10^{-5}\,\mathrm{K}\), i.e. \(1.5 \times 10^{-4}\) of the rise), and the finest-mesh error expected
    from L1 with order 2 is about \(2 \times 10^{-5}\): the geometry error would have been the floor of the mesh
    study.'
  diagnosis: A thin wedge is exact only in the limit of zero angle; its error is a fixed geometric bias that refinement
    does not remove.
  fix: 'Half-angle \(0.25^\circ\) (total \(0.5^\circ\)): bias \(10^{-5}\), below every tolerance. Decided before
    production.'
  lesson: Estimate every refinement-independent error (geometry, model) against the error the finest mesh is expected
    to reach, before production.
  guideline: 'openfoam-primer.md: axisymmetric wedges: the flat-face bias is \(1/\cos(\theta/2) - 1\); choose the
    angle so it is well below the target accuracy (\(0.5^\circ\) total gives \(10^{-5}\)).'
- id: 7
  stage: tooling
  logged: 2026-11-13 09:23
  status: resolved
  problem: 'The first draft report was refused by the contract: 0/ of the mapped meshes held <code>C</code>, <code>Cx</code>,
    <code>Cy</code>, <code>Cz</code>, <code>V</code> (undocumented settings) and the wedge and axis patches had
    explicit types instead of the <code>#includeEtc</code> line of the template.'
  diagnosis: <code>foam.map_fields</code> (mapFields) maps every field in the source's latest time, including the
    cell-centre and volume fields that <code>postProcess -func writeCellCentres/writeCellVolumes</code> wrote there
    for the analysis, and it rewrites each 0/ file in expanded form.
  fix: <code>collect</code> deletes C*, V from 0/ before post-processing; the decision on the domain covers <code>0/*/boundaryField/front|back|axis/*</code>.
  lesson: Post-processing fields written into a time directory travel to the next mesh through mapFields.
  guideline: cfdlib.foam.map_fields could pass <code>-fields '(U p p_rgh T ...)'</code> or delete postProcess fields
    after mapping; or the contract could ignore known post-processing fields (C, Cx, Cy, Cz, V) in 0/.
- id: 8
  stage: production
  logged: 2026-11-13 09:24
  status: resolved
  problem: 'Production L2 took 216 s for 859 iterations on 3200 cells (\(78\,\mu s\) per cell per iteration); L3
    and the 3D run were slowing the same way. The live stop did not end the runs quickly either: the velocity probes
    showed ''error inf'' for hundreds of iterations after the residuals had reached \(10^{-11}\).'
  diagnosis: 'The absolute pressure tolerance \(10^{-12}\) was below what GAMG can reach: once converged, the initial
    residual sat at \(2\) to \(5 \times 10^{-11}\) and every pressure solve ran to the 1000-iteration limit (L2:
    0.016 s per iteration before convergence, 0.33 s after). Those stagnating solves also leave round-off-level
    noise in the velocity, which the steady check reads as ''not settled'' until its noise-floor test fires. The
    pre-flight (300 iterations from rest) cannot see this: it ends long before convergence.'
  fix: Pressure tolerance \(10^{-9}\) with <code>maxIter 200</code>; production and the 3D runs restarted from the
    beginning with it (about 9 minutes of runs discarded).
  lesson: With a live stop, the run goes on past convergence until the check holds, so the cost of an iteration
    AT convergence matters. Absolute linear-solver tolerances must sit above the round-off floor of the converged
    state.
  guideline: 'SKILL.md stage 3: for steady runs, let the pre-flight on the coarsest mesh run to convergence and
    look at the linear-solver iteration counts at the end (a solver at its maxIter = tolerance below round-off);
    primer: give an absolute pressure tolerance about \(10^{-9}\) and a <code>maxIter</code> cap in steady SIMPLE.'
- id: 9
  stage: tooling
  logged: 2026-11-13 09:29
  status: resolved
  problem: 'After the pressure-tolerance fix, the live stop never ended L1 (ran to the 30000-iteration cap) and
    ended L2 only after 8531 iterations, although the probes had stopped changing in their 12 printed digits hundreds
    of iterations earlier. The verdict stayed ''U: running, error inf''.'
  diagnosis: '<code>cfdlib.verification.iteration_error</code> returns an infinite error whenever one of the earlier
    changes in its window is exactly zero (<code>if np.any(last[:-1] == 0.0): return out</code>). A value converged
    to output precision flickers between a zero change and one unit of the last digit, so the window almost always
    holds a zero and the estimate is never finite (and the noise-floor test needs non-zero, sign-flipping changes).
    With the old \(10^{-12}\) pressure tolerance the stagnating solver kept adding round-off changes, which hid
    this.'
  fix: 'Case-local decider (run.py <code>live_decider</code>): a column whose last 20 sampled changes are all within
    10 units of the 12th digit, and whose history has moved by more than 1000 units, counts as settled. Replayed
    on the recorded L1 and L2 histories before relying on it: stops at iterations 480 and 580, true remaining change
    \(10^{-10}\,\mathrm{K}\) and \(5 \times 10^{-13}\,\mathrm{m/s}\). Without the ''has moved'' condition the replay
    showed a false stop at iteration 40 (probes the solution had not reached yet).'
  lesson: A convergence estimator must handle the quantised end state (zero changes) as converged, not as unknown;
    replaying a stop rule on recorded histories catches both false stops and never-stops cheaply.
  guideline: 'cfdlib.verification.iteration_error / monitor.steady_check: treat a window of changes that are all
    zero or within the output precision (writePrecision) as settled with error = that precision, provided the series
    has moved; add a test with a quantised series.'
- id: 10
  stage: production
  logged: 2026-11-13 09:35
  status: resolved
  problem: 'Orphaned solvers corrupted the restarted runs: the new L3 directory contained time folders 4000 and
    4710 that the new run never wrote (its log has 1777 iterations), and the L3 record read its ''final'' fields
    from folder 4710; two 3D MPI jobs (from the old and the new attempt) were writing into the same B3D_g0 case
    at once.'
  diagnosis: 'My stop command was <code>wsl bash -c "pkill -f ''cases.heated_pipe_re200.run''; ... python -m cfdlib.foam
    stop ...; foam ps"</code>. <code>pkill -f</code> matches the full command line, and the bash running that command
    line contains the pattern itself, so pkill killed its own shell before <code>foam stop</code> ran: the empty
    output was the shell dying, not ''nothing running''. The Python wrappers died, their <code>finally</code> removed
    the PID files, and the solvers (own process groups) kept running as orphans. <code>render_case</code> then deleted
    and re-created the directories under the still-running solvers, which went on writing time folders into them.'
  fix: Killed every orphan by PID (checked with a separate <code>ps</code>), discarded all production and 3D results
    of the previous attempts, restarted everything from scratch.
  lesson: Never pkill -f with a pattern that also appears in the command doing the killing; verify with a separate
    ps call. An empty output from a kill-and-check command is a red flag, not a confirmation.
  guideline: 'environment.md: stop runs with <code>python -m cfdlib.foam stop</code> BEFORE killing the Python wrapper
    (the wrapper''s exit removes the PID file stop needs), and check with <code>foam ps</code> in a separate call.
    Tooling: <code>foam.render_case</code> could refuse to delete a directory in which <code>foam.running()</code>
    shows a live solver; <code>foam.stop</code> could also kill solvers by working directory when no PID file is
    left.'
- id: 11
  stage: analysis
  logged: 2026-11-13 09:40
  status: resolved
  problem: The error of the simulated entrance length GREW with refinement (\(+2.1 \times 10^{-4}\), \(-1.9 \times
    10^{-4}\), \(-5.1 \times 10^{-4}\) on L1 to L3) and the fully developed \(Nu\) converged more slowly (order
    1.7 then 1.3) than \(Nu(x)\) itself.
  diagnosis: 'Part of both errors belongs to the post-processing, not to the simulation. Applying the same tail
    fit \(A + B e^{-cx}\) (\(60\) to \(100\,D\)) to the EXACT solution at the same cell positions gives \(Nu_{fd}\)
    \(8 \times 10^{-5}\) too high (the fit has one exponential, the solution still carries a second mode) and, through
    the threshold \(1.05\,Nu_{fd}\), an entrance length \(6.8 \times 10^{-4}\) too short. The 5 % crossing is very
    sensitive: \(Nu\) falls only \(1.3 \times 10^{-3}\) per diameter there, so a relative error \(\epsilon\) in
    the threshold moves \(L_{th}\) by about \(16\,\epsilon\).'
  fix: Kept the acceptance rules as fixed before production (no change of estimator after seeing results). The report
    gives, next to each such number, the method bias (the post-processing applied to the exact solution) and the
    simulation's own error (difference of the two).
  lesson: Every derived quantity extracted by fitting or thresholding needs its post-processing verified on the
    exact solution BEFORE the tolerances are fixed; otherwise the method bias silently uses up the tolerance.
  guideline: 'SKILL.md stage 2 (tolerances): when a requested output is extracted by a fit, an extrapolation or
    a threshold crossing, run the same extraction on the exact solution or a manufactured one, and size the tolerance
    above that bias.'
  resolved: 2026-11-13 10:03
- id: 12
  stage: analysis
  logged: 2026-11-13 09:45
  status: resolved
  problem: 'Whether gravity matters could not be settled from the dimensionless numbers alone: \(Gr/Re^2 = 10^{-3}\)
    says no, but \(Ra \approx 280\) (and \(Ra_q \approx 1200\) on the heat flux) is in the range where mixed-convection
    correlations for horizontal tubes start to depart from forced convection, and no correlation was in the case''s
    reference files.'
  diagnosis: 'Measured instead: the same 3D half-tube mesh (81920 cells) with and without gravity. The peripheral-mean
    \(Nu\) changes by at most \(0.15\,\%\) (at the outlet, still growing along the tube), the secondary flow peaks
    near \(9 \times 10^{-4}\,U\), but at the outlet the top of the wall is \(0.034\,\mathrm{K}\) warmer than the
    bottom, \(11\,\%\) of \(\Delta T_{fd}\).'
  fix: The no-buoyancy assumption is reported as checked for \(Nu\) and the mean wall temperature, with the circumferential
    wall-temperature variation stated as a finding and limitation.
  lesson: A same-mesh pair (effect on/off) measures a small physical effect cheaply and precisely, because most
    of the discretisation error cancels in the difference. A small effect on the mean can still be a large effect
    on a local quantity (top vs bottom wall temperature).
  guideline: 'SKILL.md stage 0/1: when an assumption''s dimensionless indicator is ambiguous, measure the effect
    with a same-mesh on/off pair and report it on the requested local quantities as well as the means.'
  resolved: 2026-11-13 10:01
- id: 13
  stage: analysis
  logged: 2026-11-13 09:45
  status: resolved
  problem: The centreline velocity where heating starts was \(0.53\,\%\) below the developed \(2U\) on L1, which
    would have meant the unheated section (\(20\,D\)) is too short for the exact solution's assumption of a parabolic
    inflow.
  diagnosis: 'It shrinks with each finer mesh (\(-0.53\), \(-0.25\), \(-0.12\), \(-0.08\,\%\) on L1 to L4), first
    order at first (the singular inlet corner, uniform velocity against a no-slip wall), slower on L4. Extrapolated
