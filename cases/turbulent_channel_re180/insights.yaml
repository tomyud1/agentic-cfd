# Workflow insights, logged LIVE (cfdlib/insights.py). One entry per problem, surprise or retry:
#   id, stage, logged (real time first met), status (open | resolved), problem,
#   then when solved: diagnosis, fix, lesson, guideline (the change to the workflow that would have prevented it).
# stage: intake | theory | setup | preflight | production | analysis | report | tooling | performance

- id: 1
  stage: setup
  logged: 2026-11-14 08:28
  status: resolved
  problem: The machine file says a single run projected above about 15 minutes is a reason to coarsen the plan. A
    turbulent flow computed without a model cannot meet that. Its outputs are time averages, the bulk velocity needs
    tens of time units to settle and to average, and the finest grid that the exploration in gpucfd/DESIGN.md found
    usable (192 by 64 by 64 cells) costs about one minute per time unit.
  diagnosis: The 15 minute rule was written for runs that end when they converge. Here the length of a run is set by
    the physics (the bulk velocity forgets a disturbance in about 9 time units, theory.py) and by the statistical error
    wanted, not by the grid alone. Coarsening below 192 by 64 by 64 would give up the accuracy the problem asks about.
  fix: Kept the finest level at 192 by 64 by 64 and planned about one hour for it; kept the two coarser levels cheap
    (ratio 1.5 and 4/3 instead of 2). Said so in the decisions and in the limitations. Every run still ends on a stop
    rule fixed in advance, with a longest time per level.
  lesson: For averaged turbulence the budget is time units times cost per time unit. Plan it from the settling time
    and the statistical error, then choose the grid that fits.
  guideline: Add to the machine file, next to the 15 minute rule, a budget for runs whose outputs are time averages
    (for example a total per case), and say in WORKFLOW.md stage 3 that the pre-flight of such a run should project
    seconds per time unit and the time units needed, not only the time to a fixed end.

- id: 2
  stage: tooling
  logged: 2026-11-14 08:28
  status: resolved
  problem: The workflow asks for three meshes with refinement ratio 2, and cfdlib.verification.three_grid_study takes
    one ratio r. For this box the grids that suit the pressure solver (cell counts 3 or 9 times a power of 2, with
    three times as many cells along the flow as across it) give ratio 2 only as 96, 192, 384 cells along the flow, and
    the last has 6.3 million cells.
  diagnosis: A grid study with a constant ratio of 2 costs a factor 16 per level in a time-resolved 3D run. With
    ratios 1.5 and 4/3 (96, 144, 192 cells) the three levels fit the budget, but the tool cannot evaluate them.
  fix: analyze.py solves the three-level relations for the order and the extrapolated value with two different
    ratios (the same model as three_grid_study, error proportional to the cell size to a power), and reduces to the
    tool's result for equal ratios (checked in code).
  lesson: A constant refinement ratio is a convenience of the formula, not a requirement of the method.
  guideline: Let cfdlib.verification.three_grid_study and level_sequence take the cell sizes of the three levels (or
    two ratios), and say in WORKFLOW.md stage 2 that a ratio below 2 is acceptable for 3D time-resolved runs when it
    is the same family of grids.

- id: 3
  stage: tooling
  logged: 2026-11-14 08:28
  status: resolved
  problem: With run_transient(adapt_cfl=...) the arguments dt and sample_dt no longer mean what their names say. dt
    is a cap the step never reaches, and samples come every m steps with m taken from sample_dt over dt, so the
    time between samples follows the step. To sample every 10 steps I had to pass a cap and 10 times the cap.
  diagnosis: The adaptive step was added to an interface built for a fixed step. A cap chosen too large makes m
    small (a sample every step or two, which costs more than the solver); a cap chosen from the start field makes
    the developed flow run below the Courant number asked for.
  fix: numerics.yaml holds a cap of 0.004 time units and the steps per sample of each level (10, 15, 20, about 0.025
    time units between samples on every level); run.py passes sample_dt as steps per sample times the cap.
  lesson: With an adaptive step, the natural settings are the Courant number and the number of steps between samples.
  guideline: Give cfdlib.gpu.run_transient a sample_steps argument for runs with adapt_cfl, and make dt optional
    there (no cap unless given).

- id: 4
  stage: tooling
  logged: 2026-11-14 08:28
  status: resolved
  problem: gpucfd has no restart files, and a run on the finest level takes about an hour. A level also starts from
    the last field of the level below, which run_transient does not keep.
  diagnosis: cfdlib.gpu keeps the record of a killed run (partial) but not its field. Continuing an IMEX run needs
    the velocity and the pressure the scheme carries (set and set_pressure).
  fix: run.py has save_field and load_field (velocity, pressure, time in one file under the home folder) and saves
    the field from inside the live check every 10 time units and at the end of each run.
  lesson: The live check is the only hook inside run_transient, so a checkpoint has to ride on it.
  guideline: Add save_state and load_state to cfdlib.gpu (velocity, carried pressure, time) and a checkpoint option
    to run_transient; write_run could store the path of the last field in the record.

- id: 5
  stage: preflight
  logged: 2026-11-14 08:31
  status: resolved
  problem: The pre-flight on the finest grid ended with a health warning. The Courant number reached 1.04 although
    the adaptive step was asked to hold 0.8.
  diagnosis: run_transient re-chooses the step only at a sample, and I had set 20 steps between samples on the finest
    grid to keep the record small. The largest local Courant rate (one cell somewhere in the box) rose by 30 percent
    within those 20 steps. On the coarsest grid, with 10 steps between samples, the largest rise was 20 percent.
  fix: 10 steps between samples on every level, recorded under changes in numerics.yaml. The record of the finest
    run is larger for it (88 samples per time unit).
  lesson: The adaptive step is only as good as the interval at which it looks. The extreme of a turbulent field can
    change by a quarter within 20 steps.
  guideline: In cfdlib.gpu.run_transient, separate the interval of the step control from the sampling interval (look
    at the Courant rate every few steps, which costs one reduction on the GPU, and sample the outputs less often).
    State in its docstring that the Courant number overshoots by the growth of the rate between two looks.

- id: 6
  stage: preflight
  logged: 2026-11-14 08:36
  status: resolved
  problem: The pressure-tolerance check (cfdlib.gpu.tolerance_check) passed every tolerance from the strictest to the
    loosest tried, eight orders of magnitude below my same-answer rule, on both grids. A rule that everything
    passes by that much does not discriminate.
  diagnosis: The outputs compared were the bulk velocity and the two wall shear stresses over 0.3 time units. The
    bulk velocity is an integral that the pressure cannot change (the pressure gradient has no mean), and without
    an immersed body there is no force that is taken from the pressure. The check says the choice is safe over a
    short stretch; it cannot say anything about averages over tens of time units, because two turbulent runs part
    ways whatever the tolerance.
  fix: Took the loosest tolerance tried, which the check supports (difference 1.7 times ten to the minus 12 on the
    finest grid, divergence left four orders below the health limit, 9 percent cheaper per step there, 20 percent
    on the coarsest grid). The choice and the numbers are a decision in the report.
  lesson: For a flow without bodies the pressure tolerance is a cost setting more than an accuracy setting, and the
    divergence left after the projection is the number to watch.
  guideline: Say in cfdlib/gpu.py (tolerance_check) what to compare for a flow without bodies (a local velocity or
    the divergence, not integrals), and give the measured starting value for a turbulent channel in gpucfd/DESIGN.md.
    Its open item on a looser tolerance can be closed with these numbers for the short stretch.

- id: 7
  stage: tooling
  logged: 2026-11-14 08:36
  status: resolved
  problem: The mandatory pre-flight tool, cfdlib.monitor.preflight, works on an OpenFOAM case. With gpucfd as the
    solver there is no pre-flight tool, and nothing projects the run time of a run that ends on a statistical rule.
  diagnosis: Stage 3 of the workflow is written for OpenFOAM. A gpucfd pre-flight needs the health of a short run
    (run_transient gives it), the cost per step, the steps per time unit of the developed flow (from the Courant
    rate) and from these the seconds per time unit.
  fix: run.py has its own pre-flight (do_preflight), a short run on the coarsest grid from the start field and one on
    the finest grid from the coarse field, with that projection. It also showed that the start field turns turbulent
    within two time units.
  lesson: The projection of an averaged run is seconds per time unit times the time units the stop rule will need;
    the second factor is only known as a range before the run.
  guideline: Add a pre-flight helper to cfdlib.gpu (short run, health, cost per step, steps and seconds per time
    unit, memory) and name it in WORKFLOW.md stage 3 next to monitor.preflight.

- id: 8
  stage: tooling
  logged: 2026-11-14 08:31
  status: resolved
  problem: A command in Git Bash that called plain python with a here-document hung until the tool's two minute
    limit. Nothing was lost but the time.
  diagnosis: On this machine python in Git Bash is the Windows launcher, not the pipeline's Python in WSL, and it
    waits on the console when it is fed a here-document.
  fix: Small analysis scripts are written as files in the scratch folder and run with the WSL Python, as the machine
    file says for everything else.
