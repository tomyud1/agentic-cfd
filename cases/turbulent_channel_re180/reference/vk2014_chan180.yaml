uncertainty:
  note: 'The reference''s own uncertainty, as numbers. (1) Two independent codes: finite_difference minus spectral, for the
    scalars and as the largest difference along each profile (velocity units). (2) Statistical: the mean wall shear of a settled
    flow equals the driving force exactly, so computed_u_tau differs from 1 only by what 200 time units of averaging leave.
    Neither is a bound on the error of the reference.'
