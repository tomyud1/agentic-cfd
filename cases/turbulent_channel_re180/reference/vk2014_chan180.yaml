# Reference data of Vreman and Kuerten (2014), parsed by code (setup/parse_vk2014_channel.py) from the files
# in reference/vk2014/. Do not edit by hand.
source: A.W. Vreman and J.G.M. Kuerten, 'Comparison of direct numerical simulation databases of turbulent channel flow at
  Re_tau = 180', Physics of Fluids 26, 015102 (2014). Statistics files as published by the first author at http://www.vremanresearch.nl/channel.html
  (databases Chan180_S2 and Chan180_FD2), retrieved 2026-11-14. The flow is that of Kim, Moin and Moser, J. Fluid Mech. 177
  (1987), 133-166, and Moser, Kim and Mansour, Phys. Fluids 11 (1999), 943-945, simulated again with higher resolution and
  longer averaging.
saved_files: reference/vk2014/ holds the four files exactly as downloaded (setup/fetch_vk2014_channel.sh).
units: 'Lengths in units of the half height H of the channel, velocities in units of the friction velocity that the driving
  force fixes, sqrt(force x H) = 1 (the files'' header: H=1; nu=1/180; forcing=1). y_plus = 180 y. Profiles cover one half
  of the channel, from the wall (y = 0) to the centre plane (y = 1).'
setup:
  friction_reynolds_number: 180.0
  domain: 4pi x  2  x 4pi/3
  spectral: {database: Chan180_S2 (file Chan180_S2a_basic_few.txt), method: Fourier-Chebyshev spectral, resolution: 384 x
      193 x 192, averaging_time: 200.0, computed_u_tau: 0.9999}
  finite_difference: {database: Chan180_FD2 (files Chan180_FD2_basic_u/v/w.txt), method: finite differences on a staggered
      grid, resolution: 512 x 256 x 256, averaging_time: 200.0, computed_u_tau: 0.99996}
how_computed: 'Scalars computed by setup/parse_vk2014_channel.py from the profiles: bulk velocity = integral of the mean velocity
  over the half channel (cubic spline through the points, wall added); bulk_velocity_cell_sum = the staggered code''s own
  rule, cell value times cell height; friction coefficient = 2 / bulk^2 (wall shear stress over half the density times the
  bulk velocity squared, with the exact wall shear of the settled flow); bulk Reynolds number = bulk velocity x 2 H / nu;
  peaks from a cubic spline through the seven points around the largest value.'
